<script>
/* ================= StoreX CUSTOMER CACHE =================
   Fast repeat visits:
   1) Last complete cloud state is stored in localStorage.
   2) The cached storefront renders immediately on repeat visits.
   3) Supabase is then read in the background and the screen is refreshed.
   4) Realtime changes replace the current screen without requiring a manual reload.
*/
(function(){
  'use strict';
  const KEY = 'StoreX.customer.snapshot.v5';
  const MAX_AGE = 1000 * 60 * 60 * 24 * 30; // keep a snapshot for up to 30 days

  window.FVCustomerCache = {
    read(){
      try{
        const raw = localStorage.getItem(KEY);
        if(!raw) return null;
        const item = JSON.parse(raw);
        if(!item || !item.data) return null;
        return item;
      }catch(e){ return null; }
    },
    write(data){
      try{
        localStorage.setItem(KEY, JSON.stringify({
          version:5,
          savedAt:Date.now(),
          data:data
        }));
      }catch(e){
        // Storage can be unavailable/full; the website must still work normally.
      }
    },
    isUsable(item){
      return !!(item && item.data && (Date.now() - (item.savedAt||0)) <= MAX_AGE);
    }
  };
})();
</script>


<script>
/* ================= StoreX PERFORMANCE ENGINE ================= */
window.StoreXPerf=window.StoreXPerf||{};
StoreXPerf.compressImageForWeb=async function(file){
  if(!file||!file.type||!file.type.startsWith('image/')) return file;
  if(file.type==='image/svg+xml'||file.type==='image/gif') return file;
  const MAX_DIM=2400, QUALITY=.92;
  try{
    const bitmap=await createImageBitmap(file);
    const scale=Math.min(1,MAX_DIM/Math.max(bitmap.width,bitmap.height));
    const w=Math.max(1,Math.round(bitmap.width*scale)),h=Math.max(1,Math.round(bitmap.height*scale));
    const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
    const ctx=canvas.getContext('2d',{alpha:true,desynchronized:true}); ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
    ctx.drawImage(bitmap,0,0,w,h); bitmap.close();
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',QUALITY));
    if(!blob||blob.size>=file.size*.98) return file;
    return new File([blob],(file.name||'image').replace(/\.[^.]+$/i,'.webp'),{type:'image/webp',lastModified:Date.now()});
  }catch(e){console.warn('Image optimization skipped:',e);return file;}
};
StoreXPerf.fastPublicState=async function(){
  if(!supabaseClient||!SUPABASE_READY) return null;
  try{ const {data,error}=await supabaseClient.rpc('storex_public_state'); if(error) throw error; return data&&typeof data==='object'?data:null; }
  catch(e){console.warn('Fast public state RPC unavailable; using existing reads:',e);return null;}
};
</script>

<script>
const SEO_CONFIG = {
  siteName: "StoreX",
  siteUrl: "https://StoreX/",
  defaultTitle: "StoreX | Discover Products, Deals & Trending Finds",
  defaultDescription: "StoreX is an online product discovery store featuring trending products, electronics, fashion, beauty, home and living essentials, gadgets, accessories and more. Discover useful products, compare options and visit trusted shopping destinations through our product links.",
  keywords: "StoreX, StoreX, online shopping, trending products, best products, product discovery, electronics, gadgets, mobile accessories, fashion, beauty products, home and living, kitchen products, lifestyle products, accessories, Daraz products, Daraz affiliate, online deals, trending deals, shopping deals, useful products, Pakistan online shopping",
  robots: "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1",
  language: "en",
  themeColor: "#F57224",
  socialTitle: "StoreX | Discover Products, Deals & Trending Finds",
  socialDescription: "Discover trending products, electronics, fashion, beauty, home essentials, gadgets and more at StoreX."
};

(function applyStaticSEO(){
  const c = SEO_CONFIG;
  document.title = c.defaultTitle;

  const setMeta = (name, content, attr="name") => {
    let el = document.head.querySelector(`meta[${attr}="${name}"]`);
    if (!el) {
      el = document.createElement("meta");
      el.setAttribute(attr, name);
      document.head.appendChild(el);
    }
    el.setAttribute("content", content);
  };

  setMeta("description", c.defaultDescription);
  setMeta("keywords", c.keywords);
  setMeta("robots", c.robots);
  setMeta("og:title", c.socialTitle, "property");
  setMeta("og:description", c.socialDescription, "property");
  setMeta("og:type", "website", "property");
  setMeta("og:url", c.siteUrl, "property");
  setMeta("twitter:card", "summary_large_image");
  setMeta("twitter:title", c.socialTitle);
  setMeta("twitter:description", c.socialDescription);
  setMeta("theme-color", c.themeColor);

  let canonical = document.head.querySelector('link[rel="canonical"]');
  if (!canonical) {
    canonical = document.createElement("link");
    canonical.rel = "canonical";
    document.head.appendChild(canonical);
  }
  canonical.href = c.siteUrl;

  let lang = document.documentElement;
  if (lang) lang.lang = c.language;
})();
</script>

<script>
/* ============================================================
   StoreX — single-file storefront + admin (client-side persistence)

/* ============================================================
   StoreX — self-contained HTML configuration
   ============================================================
   Supabase is the persistent cloud source of truth for admin changes.
   The values below are safe demo fallbacks when Supabase has no saved data yet.
   Admin edits update the storefront immediately in this open page.
   To make an edit permanent for every visitor, edit DEMO_CONFIG in this
   HTML file and publish/deploy the updated HTML.

// ---------- Runtime/UI state ----------

/* ---------- Product analytics: one event per real product view / Buy Now click ---------- */
let PRODUCT_ANALYTICS = Object.create(null);
let PRODUCT_ANALYTICS_READY = false;
let PRODUCT_ANALYTICS_CHANNEL = null;
let LAST_TRACKED_PRODUCT_VIEW = '';

function analyticsCounts(p){
  const a=PRODUCT_ANALYTICS[String(p?.id||'')]||{};
  return {views:Math.max(0,Number(a.views??p?.views)||0),clicks:Math.max(0,Number(a.clicks??p?.clicks)||0)};
}
async function loadProductAnalytics(){
  if(!supabaseClient||!SUPABASE_READY)return;
  try{
    const {data,error}=await supabaseClient.from('storex_product_analytics').select('product_id,views,clicks,updated_at');
    if(error)throw error;
    PRODUCT_ANALYTICS=Object.create(null);
    (data||[]).forEach(r=>{PRODUCT_ANALYTICS[String(r.product_id)]={views:Number(r.views)||0,clicks:Number(r.clicks)||0,updated_at:r.updated_at};});
    PRODUCT_ANALYTICS_READY=true;
    if(route().startsWith('/admin-of-storex')) render();
  }catch(e){ console.warn('Product analytics read skipped:',e); }
}
async function trackProductEvent(productId,eventType){
  const id=String(productId||'').trim();
  const type=eventType==='click'?'click':'view';
  if(!id||!supabaseClient||!SUPABASE_READY)return;
  try{
    const {data,error}=await supabaseClient.rpc('storex_track_product_event',{p_product_id:id,p_event_type:type});
    if(error)throw error;
    if(data&&data.product_id){
      PRODUCT_ANALYTICS[String(data.product_id)]={views:Number(data.views)||0,clicks:Number(data.clicks)||0,updated_at:data.updated_at};
      const p=PRODUCTS.find(x=>String(x.id)===id);
      if(p){p.views=Number(data.views)||0;p.clicks=Number(data.clicks)||0;}
      if(route().startsWith('/admin-of-storex')) render();
    }
  }catch(e){ console.warn('Product analytics event skipped:',e); }
}
function trackProductViewOnce(productId){
  const id=String(productId||'').trim();
  const currentRoute=String(location.hash||'');
  const token=id+'|'+currentRoute;
  if(!id||LAST_TRACKED_PRODUCT_VIEW===token)return;
  LAST_TRACKED_PRODUCT_VIEW=token;
  trackProductEvent(id,'view');
}
function trackProductBuyClick(productId){ trackProductEvent(productId,'click'); }
function subscribeProductAnalytics(){
  if(!supabaseClient||PRODUCT_ANALYTICS_CHANNEL)return;
  try{
    PRODUCT_ANALYTICS_CHANNEL=supabaseClient.channel('storex-product-analytics-live-'+Math.random().toString(36).slice(2))
      .on('postgres_changes',{event:'*',schema:'public',table:'storex_product_analytics'},payload=>{
        const row=payload.new||payload.old; if(!row||!row.product_id)return;
        PRODUCT_ANALYTICS[String(row.product_id)]={views:Number(row.views)||0,clicks:Number(row.clicks)||0,updated_at:row.updated_at};
        const p=PRODUCTS.find(x=>String(x.id)===String(row.product_id));
        if(p){p.views=Number(row.views)||0;p.clicks=Number(row.clicks)||0;}
        if(route().startsWith('/admin-of-storex')) render();
      }).subscribe();
  }catch(e){ console.warn('Product analytics realtime unavailable:',e); }
}
let SETTINGS=null, PRODUCTS=[], CATEGORIES=[], FLASHSALES=[], BANNERS=[], MEDIA=[], PAGES=[];
let MOBILE_DRAWER_OPEN=false, MOBILE_SEARCH_OPEN=false;
let ADMIN_UNLOCKED=false, ADMIN_VIEW='dashboard', ADMIN_DRAWER_OPEN=false;
let PD_ACTIVE_IMG=0, DRAG_IDX=null;
let HERO_SLIDER_TIMER=null, FLASH_CAROUSEL_TIMERS=[];

// ---------- Core utility helpers ----------
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,10); }
function esc(str){ return String(str==null?'':str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function slugify(str){ return String(str||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
function isValidHttpUrl(str){ try{ const u=new URL(str); return u.protocol==='http:'||u.protocol==='https:'; }catch(_){ return false; } }
function fmtMoney(value){ const n=Number(value); if(!Number.isFinite(n)) return ''; return 'Rs. '+n.toLocaleString('en-PK'); }

const LOCAL_IMAGE_MAX_BYTES = 4 * 1024 * 1024;


/* ---------- Local image handling ---------- */
/* ---------- Supabase cloud persistence ---------- */
const SUPABASE_URL = 'https://roiwxjdvethytkgfrpws.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_aegiNBzOiCmE2cY6XxNmBQ_IWaeQ1dF';
const SUPABASE_BUCKET = 'storex-media';
// Cloud-only persistence: admin data is never stored in the HTML/local browser storage.
const SUPA_SETTING_KEYS = {
  settings:'settings', products:'products', categories:'categories', flashsales:'flashsales',
  banners:'banners', media:'media', pages:'pages'
};
let supabaseClient = null;
let SUPABASE_READY = false;
let SUPABASE_ADMIN = false;
let SUPABASE_SYNC_CHANNEL = null;

async function initSupabase(){
  // Supabase SDK loads asynchronously so it never blocks first paint.
  if(!window.supabase || typeof window.supabase.createClient!=='function'){
    const started=Date.now();
    while((!window.supabase || typeof window.supabase.createClient!=='function') && Date.now()-started<10000){
      await new Promise(r=>setTimeout(r,50));
    }
  }
  if(!window.supabase || typeof window.supabase.createClient!=='function') throw new Error('Supabase library could not load.');
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
  });
  SUPABASE_READY = true;
  const {data:{session}} = await supabaseClient.auth.getSession();
  if(session) await refreshAdminStatus();
  supabaseClient.auth.onAuthStateChange((_event, session)=>{
    setTimeout(async()=>{
      if(session) await refreshAdminStatus(); else {SUPABASE_ADMIN=false;ADMIN_UNLOCKED=false;}
      if(route().startsWith('/admin-of-storex')) render();
    },0);
  });
  subscribeRealtime();
}

async function refreshAdminStatus(){
  SUPABASE_ADMIN=false;
  if(!supabaseClient) return false;
  const {data:{user}}=await supabaseClient.auth.getUser();
  if(!user) return false;
  const {data,error}=await supabaseClient.from('sx_admins').select('user_id').eq('user_id',user.id).maybeSingle();
  if(error) throw error;
  SUPABASE_ADMIN=!!data;
  ADMIN_UNLOCKED=SUPABASE_ADMIN;
  return SUPABASE_ADMIN;
}

function subscribeRealtime(){
  if(!supabaseClient) return;
  try{
    if(SUPABASE_SYNC_CHANNEL){ try{ supabaseClient.removeChannel(SUPABASE_SYNC_CHANNEL); }catch(_){} SUPABASE_SYNC_CHANNEL=null; }
    SUPABASE_SYNC_CHANNEL = supabaseClient.channel('storex-live-sync-'+Math.random().toString(36).slice(2))
      .on('postgres_changes',{event:'*',schema:'public',table:'sx_settings'},payload=>{
        const row=payload.new||payload.old;
        if(!row || !row.key) return;
        applyRemoteSetting(row.key,row.value).catch(err=>console.warn('Realtime update ignored:',err));
      }).subscribe();
    loadProductAnalytics();
    subscribeProductAnalytics();
  }catch(err){ console.warn('StoreX realtime unavailable; normal cloud reads remain available.',err); }
}

async function applyRemoteSetting(key,value){
  const map={settings:'SETTINGS',products:'PRODUCTS',categories:'CATEGORIES',flashsales:'FLASHSALES',banners:'BANNERS',media:'MEDIA',pages:'PAGES'};
  const target=map[key];
  if(!target || value==null) return;
  try{
    const clone=JSON.parse(JSON.stringify(value));
    if(target==='SETTINGS'){
      if(!clone || typeof clone!=='object' || Array.isArray(clone)) return;
      SETTINGS=Object.assign({},DEFAULT_SETTINGS,clone,{hero:Object.assign({},DEFAULT_SETTINGS.hero,clone.hero||{}),footer:Object.assign({},DEFAULT_SETTINGS.footer,clone.footer||{},{social:Object.assign({},DEFAULT_SETTINGS.footer.social,(clone.footer&&clone.footer.social)||{})}),search:Object.assign({},DEFAULT_SETTINGS.search,clone.search||{}),darazPromo:Object.assign({},DEFAULT_SETTINGS.darazPromo,clone.darazPromo||{}),mediaSizing:Object.assign({},DEFAULT_SETTINGS.mediaSizing,clone.mediaSizing||{})});
    }else{
      if(!Array.isArray(clone)) return;
      window[target]=clone;
    }
    normalizeCloudState();
    applyTheme();
    try{
      if(window.FVCustomerCache){
        window.FVCustomerCache.write({
          settings:SETTINGS,
          products:PRODUCTS,
          categories:CATEGORIES,
          flashsales:FLASHSALES,
          banners:BANNERS,
          media:MEDIA,
          pages:PAGES
        });
      }
    }catch(e){}
    if(!route().startsWith('/admin-of-storex')){
      window.scrollTo({top:0,left:0,behavior:'auto'});
      render();
      applyMediaSizing();
      initLazyMedia();
    }
  }catch(err){ console.warn('Ignored malformed StoreX realtime payload:',key,err); }
}

async function loadKey(key,fallback){
  if(!SUPABASE_READY) return JSON.parse(JSON.stringify(fallback));
  try{
    const cloudKey=SUPA_SETTING_KEYS[key.replace('storex-','').replace('-v2','')]||key;
    const {data,error}=await supabaseClient.from('sx_settings').select('value').eq('key',cloudKey).maybeSingle();
    if(error) throw error;
    return data && data.value!=null ? JSON.parse(JSON.stringify(data.value)) : JSON.parse(JSON.stringify(fallback));
  }catch(e){
    console.warn('StoreX cloud read failed for',key,e);
    return JSON.parse(JSON.stringify(fallback));
  }
}

async function saveKey(key,val){
  if(!SUPABASE_READY){ toast('Supabase is not connected. Change was not saved.'); return false; }
  if(!SUPABASE_ADMIN){ toast('Admin session required. Please log in again.'); return false; }
  const cloudKey=SUPA_SETTING_KEYS[key.replace('storex-','').replace('-v2','')]||key;
  try{
    const {error}=await supabaseClient.from('sx_settings').upsert({key:cloudKey,value:JSON.parse(JSON.stringify(val)),updated_at:new Date().toISOString()},{onConflict:'key'});
    if(error) throw error;
    applyTheme(); render();
    return true;
  }catch(e){
    console.error('StoreX cloud save failed:',e);
    toast('Cloud save failed: '+(e.message||'Unknown Supabase error'));
    return false;
  }
}

async function uploadImageToSupabase(file){
  if(!SUPABASE_READY || !supabaseClient) throw new Error('Supabase is not connected.');
  if(!SUPABASE_ADMIN) throw new Error('Admin login is required to upload images.');
  if(!file || !file.type.startsWith('image/')) throw new Error('Please select an image file.');
  const optimized=await StoreXPerf.compressImageForWeb(file);
  const safeName=(optimized.name||file.name||'image').replace(/[^A-Za-z0-9._-]+/g,'-');
  const path='uploads/'+Date.now().toString(36)+'-'+uid()+'-'+safeName;
  const {error}=await supabaseClient.storage.from(SUPABASE_BUCKET).upload(path,optimized,{contentType:optimized.type||file.type||'application/octet-stream',upsert:false,cacheControl:'31536000'});
  if(error) throw error;
  const {data}=supabaseClient.storage.from(SUPABASE_BUCKET).getPublicUrl(path);
  if(!data?.publicUrl) throw new Error('Supabase did not return a public image URL.');
  return data.publicUrl;
}

async function handleLocalFileInput(input,callback){
  const file=input.files&&input.files[0]; if(!file)return;
  input.disabled=true;
  try{
    const url=await uploadImageToSupabase(file);
    await rememberMediaUrl(url,file.name||'image');
    callback(url);
    toast('Original image uploaded to Supabase ✓');
  }catch(e){
    console.error(e); toast('Image upload failed: '+(e.message||'Unknown error'));
  }finally{input.disabled=false; input.value='';}
}

async function rememberMediaUrl(url,name){
  if(!url)return;
  if(!Array.isArray(MEDIA))MEDIA=[];
  if(!MEDIA.some(m=>m.dataUrl===url || m.name===url || m.publicUrl===url)){
    MEDIA.push({id:uid(),name:name||url,dataUrl:url,publicUrl:url});
    await saveKey(KEYS.media,MEDIA);
  }
}

async function boot(){
  const fallback=buildDemoConfig();
  if(!SETTINGS) SETTINGS=JSON.parse(JSON.stringify(fallback.settings));
  SETTINGS.sections=Array.isArray(SETTINGS.sections)?SETTINGS.sections:[];
  PRODUCTS=[]; CATEGORIES=[]; FLASHSALES=[]; BANNERS=[]; MEDIA=[]; PAGES=[];

  // Render the last complete Supabase snapshot immediately.
  try{
    const cached=window.FVCustomerCache&&window.FVCustomerCache.read();
    if(window.FVCustomerCache&&window.FVCustomerCache.isUsable(cached)){
      const c=cached.data||{};
      if(c.settings) SETTINGS=c.settings;
      if(Array.isArray(c.products)) PRODUCTS=c.products;
      if(Array.isArray(c.categories)) CATEGORIES=c.categories;
      if(Array.isArray(c.flashsales)) FLASHSALES=c.flashsales;
      if(Array.isArray(c.banners)) BANNERS=c.banners;
      if(Array.isArray(c.media)) MEDIA=c.media;
      if(Array.isArray(c.pages)) PAGES=c.pages;
      normalizeCloudState(); applyTheme(); injectGA(); render(); applyMediaSizing(); initLazyMedia();
      window.FV_CACHE_FIRST_RENDERED=true;
    }else{
      // No cache: show the shell immediately; do not wait for Supabase.
      applyTheme(); render();
    }
  }catch(e){ console.warn('StoreX cache-first startup skipped:',e); try{applyTheme();render();}catch(_){} }

  // Supabase/network work is background work and never blocks the customer screen.
  try{ await initSupabase(); loadProductAnalytics(); subscribeProductAnalytics(); }catch(e){ console.error('Supabase initialization failed:',e); return; }

  // One public-state RPC is preferred: one round-trip instead of seven.
  const FAST_STATE=await StoreXPerf.fastPublicState();
  let settings,products,categories,flashsales,banners,media,pages;
  if(FAST_STATE){
    settings=FAST_STATE.settings||fallback.settings; products=FAST_STATE.products||[]; categories=FAST_STATE.categories||[];
    flashsales=FAST_STATE.flashsales||[]; banners=FAST_STATE.banners||[]; media=FAST_STATE.media||[]; pages=FAST_STATE.pages||[];
  }else{
    [settings,products,categories,flashsales,banners,media,pages]=await Promise.all([
      loadKey(KEYS.settings,fallback.settings),loadKey(KEYS.products,[]),loadKey(KEYS.categories,[]),loadKey(KEYS.flashsales,[]),
      loadKey(KEYS.banners,[]),loadKey(KEYS.media,[]),loadKey(KEYS.pages,[])
    ]);
  }
  SETTINGS=Object.assign({},DEFAULT_SETTINGS,settings||{}, {
    hero:Object.assign({},DEFAULT_SETTINGS.hero,(settings&&settings.hero)||{}),
    footer:Object.assign({},DEFAULT_SETTINGS.footer,(settings&&settings.footer)||{},{social:Object.assign({},DEFAULT_SETTINGS.footer.social,(settings&&settings.footer&&settings.footer.social)||{})}),
    search:Object.assign({},DEFAULT_SETTINGS.search,(settings&&settings.search)||{}),
    darazPromo:Object.assign({},DEFAULT_SETTINGS.darazPromo,(settings&&settings.darazPromo)||{}),
    mediaSizing:Object.assign({},DEFAULT_SETTINGS.mediaSizing,(settings&&settings.mediaSizing)||{})
  });
  PRODUCTS=Array.isArray(products)?products:[]; CATEGORIES=Array.isArray(categories)?categories:[];
  FLASHSALES=Array.isArray(flashsales)?flashsales:[]; BANNERS=Array.isArray(banners)?banners:[];
  MEDIA=Array.isArray(media)?media:[]; PAGES=Array.isArray(pages)?pages:[]; SETTINGS.siteName='StoreX';
  buildStoreXPages().forEach(sp=>{ const existing=PAGES.find(pg=>slugify(pg.slug)===slugify(sp.slug)); if(existing) Object.assign(existing,sp); else PAGES.push(sp); });
  normalizeCloudState(); applyTheme(); injectGA();
  if('scrollRestoration' in history) history.scrollRestoration='manual';
  if(!window.__StoreXHashBound){ window.__StoreXHashBound=true; window.addEventListener('hashchange',()=>{window.scrollTo({top:0,left:0,behavior:'auto'});render();}); }
  render(); applyMediaSizing(); initLazyMedia();
  try{ if(window.FVCustomerCache) window.FVCustomerCache.write({settings:SETTINGS,products:PRODUCTS,categories:CATEGORIES,flashsales:FLASHSALES,banners:BANNERS,media:MEDIA,pages:PAGES}); }catch(e){console.warn('StoreX cache write skipped:',e);}
}

function loadLazyBackground(el){
  if(!el || el.dataset.lazyLoaded==='1') return;
  const url=el.getAttribute('data-lazy-bg');
  if(!url) return;
  el.style.backgroundImage=`url("${url.replace(/"/g,'\\"')}")`;
  el.dataset.lazyLoaded='1';
  el.removeAttribute('data-lazy-bg');
}

function initLazyMedia(){
  const lazyImages=document.querySelectorAll('img[loading="lazy"]');
  lazyImages.forEach(img=>{ if(!img.getAttribute('src')) img.removeAttribute('loading'); });

  const bgNodes=document.querySelectorAll('[data-lazy-bg]');
  if(!bgNodes.length) return;
  if(!('IntersectionObserver' in window)){ bgNodes.forEach(loadLazyBackground); return; }
  const io=new IntersectionObserver((entries,observer)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        loadLazyBackground(entry.target);
        observer.unobserve(entry.target);
      }
    });
  },{rootMargin:'120px 0px'});
  bgNodes.forEach(el=>io.observe(el));
}

  if(!SETTINGS) return;

  let v=String(value||fallback).trim().replace(/:/g,'/');

function setMetaTag(name, content){

/* ---------- StoreX dynamic SEO helper ----------
   FUTURE SEO LOCATION: SEO_CONFIG above is the main SEO control panel.
   Page-specific SEO can also be entered through the Admin > Pages SEO fields.
---------------------------------------------------- */
function applyStoreXRouteSEO(pageTitle, pageDescription, pageKeywords, canonicalPath){
  const title = pageTitle ? `${pageTitle} | StoreX` : SEO_CONFIG.defaultTitle;
  const desc = pageDescription || SEO_CONFIG.defaultDescription;
  const keywords = pageKeywords || SEO_CONFIG.keywords;
  document.title = title;

  const set = (name, content, attr="name") => {
    let el=document.head.querySelector(`meta[${attr}="${name}"]`);
    if(!el){ el=document.createElement("meta"); el.setAttribute(attr,name); document.head.appendChild(el); }
    el.setAttribute("content", content || "");
  };
  set("description", desc);
  set("keywords", keywords);
  set("og:title", title, "property");
  set("og:description", desc, "property");
  set("og:url", canonicalPath ? `https://StoreX/${canonicalPath.replace(/^\//,"")}` : SEO_CONFIG.siteUrl, "property");
  set("twitter:title", title);
  set("twitter:description", desc);

  let canonical=document.head.querySelector('link[rel="canonical"]');
  if(!canonical){ canonical=document.createElement("link"); canonical.rel="canonical"; document.head.appendChild(canonical); }
  canonical.href=canonicalPath ? `https://StoreX/${canonicalPath.replace(/^\//,"")}` : SEO_CONFIG.siteUrl;
}

function applySEO(seo, fallbackTitle, fallbackDesc){
  const siteName = (SETTINGS&&SETTINGS.siteName)||'StoreX';
  document.title = (seo&&seo.title) ? seo.title : (fallbackTitle? fallbackTitle+' | '+siteName : siteName);
  setMetaTag('description', (seo&&seo.description) || fallbackDesc || (SETTINGS&&SETTINGS.footer&&SETTINGS.footer.about) || '');

}

function route(){ return location.hash.replace(/^#/,'') || '/'; }

let StoreX_RENDERING=false;
function normalizeCloudState(){
  if(!Array.isArray(PRODUCTS)) PRODUCTS=[];
  if(!Array.isArray(CATEGORIES)) CATEGORIES=[];
  if(!Array.isArray(FLASHSALES)) FLASHSALES=[];
  if(!Array.isArray(BANNERS)) BANNERS=[];
  if(!Array.isArray(MEDIA)) MEDIA=[];
  if(!Array.isArray(PAGES)) PAGES=[];
  if(!SETTINGS || typeof SETTINGS!=='object' || Array.isArray(SETTINGS)) SETTINGS={};
  SETTINGS.search=SETTINGS.search&&typeof SETTINGS.search==='object'?SETTINGS.search:{};
  SETTINGS.nav=Array.isArray(SETTINGS.nav)?SETTINGS.nav:[];
  SETTINGS.sections=Array.isArray(SETTINGS.sections)?SETTINGS.sections:[];
  SETTINGS.mediaSizing=Object.assign({},DEFAULT_SETTINGS.mediaSizing,SETTINGS.mediaSizing||{});

  // Keep one canonical custom/information page per slug.
  const uniquePages=new Map();
  PAGES.forEach(pg=>{
    if(!pg || !pg.slug) return;
    const slug=slugify(pg.slug);
    const normalized=Object.assign({},pg,{slug});
    const existing=uniquePages.get(slug);
    if(!existing || (normalized.status==='published' && existing.status!=='published')) uniquePages.set(slug,normalized);
  });
  PAGES=Array.from(uniquePages.values());

  // Do not allow duplicate internal page links in the configured navigation.
  const seenNav=new Set();
  SETTINGS.nav=SETTINGS.nav.filter(n=>{
    if(!n || !n.url) return false;
    const u=String(n.url).trim();
    if(/^#\/page\//i.test(u)){
      const key=u.split('?')[0].toLowerCase();
      if(seenNav.has(key)) return false;
      seenNav.add(key);
    }
    return true;
  });
}
function hideStoreXLoader(){ const el=document.getElementById('StoreX-loading'); if(el){el.classList.add('is-hidden');el.style.display='none';} }
function safeRenderFallback(message){
  hideStoreXLoader();
  const app=document.getElementById('app');
  if(!app) return;
  app.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Arial,sans-serif;background:#f7f7f7;color:#1f2328;text-align:center"><div><p style="margin:0;color:#666">'+esc(message||'Store is temporarily unavailable.')+'</p></div></div>';
}
function render(){
  if(StoreX_RENDERING) return;
  StoreX_RENDERING=true;
  try{
    normalizeCloudState();
    const h = route();
    const app = document.getElementById('app');
    if(!app) throw new Error('StoreX app container is missing.');
    if(h.startsWith('/admin-of-storex')){
      app.innerHTML = renderAdminRoot();
      wireAdminEvents();
      return;
    }
    let body='';
    resetDefaultSEO();
    if(h==='/' || h===''){ body = renderHome(); }
    else if(h.startsWith('/product/')){ body = renderProductPage(decodeURIComponent(h.split('/product/')[1])); }
    else if(h.startsWith('/category/')){ body = renderCategoryPage(decodeURIComponent(h.split('/category/')[1])); }
    else if(h.startsWith('/flash-sale/')){ body = renderFlashSalePage(decodeURIComponent(h.split('/flash-sale/')[1])); }
    else if(h==='/flash-sale'){ body = renderFlashSaleIndex(); }
    else if(h.startsWith('/search')){ const q = new URLSearchParams(h.split('?')[1]||'').get('q')||''; body = renderSearchPage(q); }
    else if(h.startsWith('/page/')){ body = renderCustomPage(decodeURIComponent(h.split('/page/')[1])); }
    else { body = renderNotFound(); }
    app.innerHTML = renderHeader() + '<main>'+body+'</main>' + renderFooter() + renderMobileDrawer();
    wireStorefrontEvents();
    startCountdowns();
    initHeroSlider();
    initFlashCarousels();
    initFlashVisuals();
    initLazyMedia();
  }catch(err){
    console.error('StoreX render error:',err);
    safeRenderFallback('Store is temporarily unavailable.');
  }finally{
    StoreX_RENDERING=false;
    hideStoreXLoader();
  }
}

function searchSuggestions(q){
  const query=(q||'').trim().toLowerCase();
  if(!query){return [];}
  const words=query.split(/\s+/).filter(Boolean);
  const configured=SETTINGS.search?.letterSuggestions||{};
  const custom=Object.values(configured).flat();
  const corpus=[...getSearchCorpus(),...custom,...Object.values(BUILTIN_LETTER_SUGGESTIONS).flat()];
  return [...new Set(corpus.filter(Boolean))].map(v=>({v,score:words.reduce((n,w)=>{const x=v.toLowerCase();return n+(x.startsWith(w)?4:(x.includes(w)?2:0));},0)}))
    .filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.v.length-b.v.length)
    .slice(0,Number(SETTINGS.search?.maxSuggestions)||10).map(x=>x.v);
}
function letterSuggestions(){
  const custom=SETTINGS.search?.letterSuggestions||{};
  return Object.fromEntries(Object.keys(BUILTIN_LETTER_SUGGESTIONS).map(k=>[k,[...(custom[k]||[]),...BUILTIN_LETTER_SUGGESTIONS[k]]].filter(Boolean).slice(0,12)));
}

function openSearchSuggestions(input){
  const wrap=input.closest('.search-wrap');

  if(!box) return;
  const q=String(input.value||'').trim();
  const suggestions=searchSuggestions(q);
  const trends=trendingSearches();
  const values=q ? suggestions : trends;
  if(!values.length){
    box.innerHTML='<div class="search-suggestions-head">Suggestions</div><div style="padding:12px;color:var(--ink-soft);font-size:12px;">No suggestions yet — keep typing or press Search.</div>';
  }else{
    box.innerHTML='<div class="search-suggestions-head">'+(q?'Suggestions':'Trending searches')+'</div>'+values.map(v=>`<button type="button" class="search-suggestion" data-search-value="${esc(v)}" aria-label="Search ${esc(v)}"><span>${q?'':'↗ '}${esc(v)}</span><small>${q?'Search':'Trending'}</small></button>`).join('');
  }
  box.classList.add('open');
}

function performSearchQuery(v){
  const query=String(v||'').trim();
  if(!query) return false;
  // Always put the selected keyword into the visible search box first.
  document.querySelectorAll('.search-form input[name="q"]').forEach(input=>{ input.value=query; });
  document.querySelectorAll('.search-suggestions').forEach(box=>box.classList.remove('open'));
  // Keep the search field open on mobile after selecting a suggestion.
  MOBILE_SEARCH_OPEN=true;
  const target='/search?q='+encodeURIComponent(query);
  if(location.hash==='#'+target){
    render();
  }else{
    location.hash=target;
  }
  return false;
}

let FLASH_VISUAL_TIMERS = [];
function initFlashVisuals(){
  FLASH_VISUAL_TIMERS.forEach(t=>clearInterval(t));

function initFlashCarousels(){
  FLASH_CAROUSEL_TIMERS.forEach(t=>clearInterval(t));
  FLASH_CAROUSEL_TIMERS = [];
  document.querySelectorAll('.flash-carousel').forEach(wrap=>{
    const track = wrap.querySelector('.flash-track');
    const slides = wrap.querySelectorAll('.flash-slide');
    const dots = wrap.querySelectorAll('.flash-dots button');
    if(!track || slides.length<2) return;
    let idx = 0;
    const goTo = (i)=>{
      idx = i;
      track.style.transform = `translateX(-${idx*100}%)`;
      dots.forEach((d,di)=>d.classList.toggle('active', di===idx));
    };
    dots.forEach(d=>d.addEventListener('click', (e)=>{ e.preventDefault(); goTo(Number(d.getAttribute('data-dot'))); }));
    const timer = setInterval(()=>{ goTo((idx+1) % slides.length); }, 5000);
    FLASH_CAROUSEL_TIMERS.push(timer);
  });
}

function safeRichHtml(html){
  let s=String(html||'');
  s=s.replace(/<\s*(script|iframe|object|embed|form|link|meta)[^>]*>[\s\S]*?<\s*\/\s*\1\s*>/gi,'');
  s=s.replace(/<\s*(script|iframe|object|embed|form|link|meta)[^>]*\/?\s*>/gi,'');
  s=s.replace(/\son[a-z]+\s*=\s*(['"]).*?\1/gi,'');
  s=s.replace(/\s(href|src)\s*=\s*(['"])\s*javascript:[\s\S]*?\2/gi,'');
  return s;
}

function storefrontShareUrl(){ return window.location.origin + window.location.pathname; }
async function copyShareLink(url){ try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(url); toast('Share link copied ✓'); return; } }catch(_){} try{ const ta=document.createElement('textarea'); ta.value=url; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Share link copied ✓'); }catch(_){ toast('Please copy the link from the address bar.'); } }
async function shareStoreX(url,title,text){ try{ if(navigator.share){ await navigator.share({title:title||SETTINGS?.siteName||'StoreX',text:text||'',url}); return; } }catch(e){ if(e?.name==='AbortError') return; } await copyShareLink(url); }
function shareProduct(id){ const p=PRODUCTS.find(x=>String(x.id)===String(id)); if(!p)return toast('Product is not available.'); const key=encodeURIComponent((p.seo&&p.seo.slug)||p.id); shareStoreX(storefrontShareUrl()+'#/product/'+key,p.shortTitle||p.title,'Check out this product on '+(SETTINGS?.siteName||'StoreX')+'.'); }

function shareFlashSale(slug,title){ const key=encodeURIComponent(slug||''); shareStoreX(storefrontShareUrl()+'#/flash-sale/'+key,title||'Flash Sale','Check out this flash sale on '+(SETTINGS?.siteName||'StoreX')+'.'); }

/* ================= COUNTDOWN ================= */
let COUNTDOWN_TIMER = null;
function startCountdowns(){
  if(COUNTDOWN_TIMER) clearInterval(COUNTDOWN_TIMER);
  const tick = ()=>{
    document.querySelectorAll('[data-countdown]').forEach(el=>{
      const end = el.getAttribute('data-countdown');
      if(!end) return;
      const diff = new Date(end).getTime() - Date.now();
      if(diff<=0){ el.innerHTML = '<div class="chip" style="min-width:auto;padding:8px 14px;">Sale ended</div>'; return; }
      const d = Math.floor(diff/86400000), h=Math.floor(diff/3600000)%24, m=Math.floor(diff/60000)%60, s=Math.floor(diff/1000)%60;
      const dEl=el.querySelector('.d'),hEl=el.querySelector('.h'),mEl=el.querySelector('.m'),sEl=el.querySelector('.s');
      if(dEl){dEl.textContent=String(d).padStart(2,'0');hEl.textContent=String(h).padStart(2,'0');mEl.textContent=String(m).padStart(2,'0');sEl.textContent=String(s).padStart(2,'0');}
    });
  };
  tick(); COUNTDOWN_TIMER = setInterval(tick,1000);
}

function wireStorefrontEvents(){
  // Event delegation keeps storefront controls working after every hash-route render.
  // Most controls use inline handlers, but delegation covers links/forms that are
  // dynamically replaced and makes local-file Chrome usage more reliable.
  const app=document.getElementById('app');
  if(!app || app.dataset.StoreXWired==='1') return;
  app.dataset.StoreXWired='1';
  app.addEventListener('click',e=>{
    const a=e.target.closest('a[href^="#/"]');
    if(a){
      const href=a.getAttribute('href');
      if(href){ e.preventDefault(); window.scrollTo({top:0,left:0,behavior:'auto'}); location.hash=href.slice(1)||'/'; }
    }
  });
  app.addEventListener('submit',e=>{
    const form=e.target.closest('.search-form');
    if(!form) return;
    e.preventDefault();
    const input=form.querySelector('input[name="q"]');
    const q=(input?.value||'').trim();
    if(q) location.hash='/search?q='+encodeURIComponent(q);
  });
}

  const draft = isNew ? window.__draftProduct : PRODUCTS.find(x=>x.id===pid);
  const title = fd.get('title').trim();
  const darazUrl = fd.get('darazUrl').trim();
  if(!isValidHttpUrl(darazUrl)){ toast('Please enter a valid http(s) Daraz URL'); return; }
  Object.assign(draft, {
    title, shortTitle: fd.get('shortTitle').trim(), sku: fd.get('sku').trim(),
    shortDesc: fd.get('shortDesc').trim(), fullDesc: fd.get('fullDesc').trim(),
    category: fd.get('category'), tags: fd.get('tags').split(',').map(t=>t.trim()).filter(Boolean),
    price: fd.get('price')?Number(fd.get('price')):'', oldPrice: fd.get('oldPrice')?Number(fd.get('oldPrice')):'',

function renderFlashProductsList(f){
  if(!f.products || !f.products.length) return '<p style="font-size:13px;color:var(--ink-soft);">No products added yet.</p>';
  return f.products.map((entry,i)=>{
    const label = entry.type==='existing' ? (PRODUCTS.find(p=>p.id===entry.productId)||{}).title || 'Unknown product' : entry.title+' (custom)';
    return `<div class="section-list-item" style="cursor:default;"><span class="meta"><b>${esc(label)}</b></span><button type="button" class="btn small danger" onclick="removeFlashProduct('${f.id}',${i})">Remove</button></div>`;
  }).join('');
}

function getFlashDraft(id, isNew){ return isNew ? window.__draftFlash : FLASHSALES.find(x=>x.id===id); }

function addExistingToFlash(id, isNew){
  const f = getFlashDraft(id,isNew); const sel = document.getElementById('flash-existing-select');
  if(!sel.value) return;
  f.products = f.products||[]; f.products.push({type:'existing', productId: sel.value});
  document.getElementById('flash-products-list').innerHTML = renderFlashProductsList(f);
}

function addCustomFlashProduct(id, isNew){
  const f = getFlashDraft(id,isNew);
  const title = prompt('Custom product title:'); if(!title) return;
  const price = prompt('Price (optional):','') || '';
  const darazUrl = prompt('Daraz URL:','') || '';
  f.products = f.products||[]; f.products.push({type:'custom', title, darazUrl, image:null, desc:'', badge:''});
  document.getElementById('flash-products-list').innerHTML = renderFlashProductsList(f);
}

function removeFlashProduct(id, idx){
  const isNewCheck = !FLASHSALES.find(x=>x.id===id);
  const f = getFlashDraft(id, isNewCheck);
  f.products.splice(idx,1);
  document.getElementById('flash-products-list').innerHTML = renderFlashProductsList(f);
}

function saveFlashForm(id, isNew){
  const form = document.getElementById('flash-form'); const fd = new FormData(form);
  const draft = getFlashDraft(id,isNew);
  if(!draft.banner){ toast('Please add Flash Sale Image 1 (it is required)'); return; }

  Object.assign(draft,{
    title, slug: slugify(fd.get('slug').trim()||title), subtitle: fd.get('subtitle').trim(),
    start: fd.get('start'), end: fd.get('end'), status: fd.get('status'), description: fd.get('description').trim(),

/* ---------- Homepage Builder ---------- */

function adminHomepage(){
  const items = SETTINGS.sections.map((s,i)=>`
    <div class="section-list-item" draggable="true" data-idx="${i}" ondragstart="DRAG_IDX=${i};this.classList.add('dragging');" ondragend="this.classList.remove('dragging');" ondragover="event.preventDefault();" ondrop="reorderSection(${i});">
      <span class="handle">\u2630</span>
      <span class="meta"><b>${esc(s.title||sectionTypeLabel(s.type))}</b><div>${sectionTypeLabel(s.type)}${s.visible?'':' \u2022 hidden'}</div></span>
      <div class="row-actions">
        <button class="btn small ghost" onclick="toggleSectionVisible(${i})">${s.visible?'Hide':'Show'}</button>
        <button class="btn small ghost" onclick="editSectionModal(${i})">Edit</button>
        <button class="btn small ghost" onclick="duplicateSection(${i})">Duplicate</button>
        <button class="btn small danger" onclick="removeSection(${i})">Delete</button>
      </div>
    </div>`).join('');
  return `<div class="admin-topbar"><h1>Homepage Builder</h1><button class="btn" onclick="addSectionModal()">+ Add Section</button></div>
  <div class="help-note">Drag sections by the \u2630 handle to reorder them. All changes apply live across your store immediately.</div>
  <div class="admin-card">${items || '<p style="color:var(--ink-soft);font-size:13.5px;">No sections yet.</p>'}</div>`;

function sectionTypeLabel(t){ return {hero:'Hero banner',flashsale:'Flash sale',categories:'Categories',productCollection:'Product collection',categoryShowcase:'Products by category (auto)',banner:'Promotional banner',darazPromo:'Daraz mini banner',customHtml:'Custom text/HTML'}[t]||t; }

function reorderSection(dropIdx){
  if(DRAG_IDX===null || DRAG_IDX===dropIdx) return;
  const arr = SETTINGS.sections; const [moved] = arr.splice(DRAG_IDX,1); arr.splice(dropIdx,0,moved);
  DRAG_IDX=null; saveKey(KEYS.settings,SETTINGS);
}

function toggleSectionVisible(i){ SETTINGS.sections[i].visible = !SETTINGS.sections[i].visible; saveKey(KEYS.settings,SETTINGS); }
function duplicateSection(i){ const copy=JSON.parse(JSON.stringify(SETTINGS.sections[i])); copy.id=uid(); SETTINGS.sections.splice(i+1,0,copy); saveKey(KEYS.settings,SETTINGS); }
function removeSection(i){ if(!confirm('Delete this section?')) return; SETTINGS.sections.splice(i,1); saveKey(KEYS.settings,SETTINGS); }

function addSectionModal(){
  showModal(`<h2>Add Section</h2>
    <div class="form-grid">
      ${['hero','flashsale','categories','productCollection','categoryShowcase','banner','customHtml'].map(t=>`<button type="button" class="btn ghost" style="justify-content:flex-start;" onclick="${t==='flashsale'?'addFlashSaleSectionModal()':`addSection('${t}')`}">+ ${sectionTypeLabel(t)}</button>`).join('')}
    </div>
    <div class="modal-close-row"><button type="button" class="btn ghost" onclick="closeModal()">Close</button></div>`);
}

function addSection(type){
  const base = {id:uid(),type,visible:true,title:sectionTypeLabel(type),subtitle:''};
  if(type==='flashsale') base.config={flashSaleId:''};
  if(type==='productCollection') base.config={filter:'all',count:6,layout:'grid',columns:3,productId:''};
  if(type==='categoryShowcase') base.config={count:3};
  if(type==='banner') base.config={bannerId: BANNERS[0]?BANNERS[0].id:''};
  if(type==='customHtml') base.config={html:'<p>Your custom content here.</p>'};
  SETTINGS.sections.push(base); saveKey(KEYS.settings,SETTINGS); closeModal();
}

function addFlashSaleSectionModal(){
  const options = FLASHSALES.map(f=>`<option value="${f.id}">${esc(f.title)}</option>`).join('');
  showModal(`<h2>Add Flash Sale Section</h2>
    <form onsubmit="event.preventDefault(); createFlashSaleSection(this);">
      <div class="form-grid">
        <div class="field full"><label>Which Flash Sale</label><select name="flashSaleId"><option value="">Auto (show all active flash sales)</option>${options}</select></div>
        <div class="field full"><label>Select Flash Sale Placement / Position</label>
          <select name="position">
            <option value="0">Top Flash Sale (1st position)</option>
            <option value="1">2nd position</option>
            <option value="2">3rd position</option>
            <option value="3">4th position</option>
            <option value="bottom" selected>Bottom Flash Sale (end of homepage)</option>
          </select>
        </div>
      </div>
      <div class="modal-close-row"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn">Add Section</button></div>
    </form>`);
}

function insertSectionAtPosition(section, position){
  const arr = SETTINGS.sections;
  if(position==='bottom'){ arr.push(section); return; }
  const idx = Math.max(0, Math.min(Number(position)||0, arr.length));
  arr.splice(idx, 0, section);
}

function createFlashSaleSection(form){
  const fd = new FormData(form);
  const base = {id:uid(),type:'flashsale',visible:true,title:sectionTypeLabel('flashsale'),subtitle:'',config:{flashSaleId: fd.get('flashSaleId')||''}};
  insertSectionAtPosition(base, fd.get('position'));
  saveKey(KEYS.settings,SETTINGS); closeModal(); toast('Flash sale section added at the selected position');
}

function editSectionModal(i){

    const layout = s.config.layout||'grid';
    extra = `<div class="field"><label>Layout</label><select name="layout" onchange="document.getElementById('pc-grid-fields').style.display=this.value==='grid'?'contents':'none';document.getElementById('pc-spotlight-fields').style.display=this.value==='spotlight'?'block':'none';"><option value="grid" ${layout==='grid'?'selected':''}>Grid (multiple products)</option><option value="spotlight" ${layout==='spotlight'?'selected':''}>Spotlight (1 big product)</option></select></div>
    <div class="field"><label>Filter</label><select name="filter"><option value="all" ${s.config.filter==='all'?'selected':''}>All published</option><option value="featured" ${s.config.filter==='featured'?'selected':''}>Featured</option><option value="trending" ${s.config.filter==='trending'?'selected':''}>Trending</option><option value="newArrival" ${s.config.filter==='newArrival'?'selected':''}>New arrivals</option><option value="bestSeller" ${s.config.filter==='bestSeller'?'selected':''}>Best sellers</option></select></div>

      <div class="field"><label>Columns per row</label><select name="columns"><option value="2" ${Number(s.config.columns)===2?'selected':''}>2</option><option value="3" ${(!s.config.columns||Number(s.config.columns)===3)?'selected':''}>3</option><option value="4" ${Number(s.config.columns)===4?'selected':''}>4</option></select></div>
    </div>
    <div id="pc-spotlight-fields" class="field full" style="display:${layout==='spotlight'?'block':'none'};">
      <label>Which product (spotlight)</label>
      <select name="productId"><option value="">Auto (first match of filter above)</option>${PRODUCTS.map(p=>`<option value="${p.id}" ${s.config.productId===p.id?'selected':''}>${esc(p.shortTitle||p.title)}</option>`).join('')}</select>
    </div>`;
  } else if(s.type==='flashsale'){
    const fsOptions = FLASHSALES.map(f=>`<option value="${f.id}" ${(s.config&&s.config.flashSaleId)===f.id?'selected':''}>${esc(f.title)}</option>`).join('');
    extra = `<div class="field full"><label>Which Flash Sale</label><select name="flashSaleId"><option value="">Auto (show all active flash sales, carousel if 2+)</option>${fsOptions}</select></div>
    <div class="field full"><label>Select Flash Sale Placement / Position</label>
      <select name="position" onchange="moveSectionToPosition(${i}, this.value);">
        <option value="">\u2014 Keep current position \u2014</option>
        <option value="0">Top Flash Sale (1st position)</option>
        <option value="1">2nd position</option>
        <option value="2">3rd position</option>
        <option value="3">4th position</option>
        <option value="bottom">Bottom Flash Sale (end of homepage)</option>
      </select>
    </div>`;
  } else if(s.type==='categoryShowcase'){
    extra = `<div class="field"><label>Products per category</label><input type="number" name="count" value="${(s.config&&s.config.count)||3}"></div>`;
  } else if(s.type==='banner'){
    extra = `<div class="field full"><label>Which banner</label><select name="bannerId">${BANNERS.map(b=>`<option value="${b.id}" ${s.config.bannerId===b.id?'selected':''}>${esc(b.heading||b.id)}</option>`).join('')||'<option value="">No banners yet</option>'}</select></div>`;

    <form id="section-form" onsubmit="event.preventDefault(); saveSectionForm(${i});">
      <div class="form-grid">
        <div class="field"><label>Section title</label><input type="text" name="title" value="${esc(s.title||'')}"></div>
        <div class="field"><label>Subtitle</label><input type="text" name="subtitle" value="${esc(s.subtitle||'')}"></div>
        ${extra}

      <div class="modal-close-row"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn">Save</button></div>
    </form>`);
}

function moveSectionToEdge(i,where){
  const arr = SETTINGS.sections; const [moved] = arr.splice(i,1);
  if(where==='top') arr.unshift(moved); else arr.push(moved);
  saveKey(KEYS.settings,SETTINGS); closeModal(); toast('Section moved to '+where);
}

function moveSectionToPosition(i, position){
  if(position===''||position==null) return;
  const arr = SETTINGS.sections; const [moved] = arr.splice(i,1);
  insertSectionAtPosition(moved, position);
  saveKey(KEYS.settings,SETTINGS); closeModal(); toast('Flash sale section moved to the selected position');
}

function saveSectionForm(i){
  const form=document.getElementById('section-form'); const fd=new FormData(form);
  const s = SETTINGS.sections[i];
  s.title = fd.get('title'); s.subtitle = fd.get('subtitle');
  if(s.type==='flashsale'){ s.config = {flashSaleId: fd.get('flashSaleId')||''}; }
  if(s.type==='productCollection'){ s.config = {filter:fd.get('filter'), count:Number(fd.get('count'))||6, layout:fd.get('layout')||'grid', columns:Number(fd.get('columns'))||3, productId:fd.get('productId')||''}; }
  if(s.type==='categoryShowcase'){ s.config = {count:Number(fd.get('count'))||3}; }
  if(s.type==='banner'){ s.config = {bannerId: fd.get('bannerId')}; }
  if(s.type==='customHtml'){ s.config = {html: fd.get('html')}; }
  saveKey(KEYS.settings,SETTINGS); closeModal();
}

function moveNav(i,dir){ const arr=SETTINGS.nav; const j=i+dir; if(j<0||j>=arr.length) return; [arr[i],arr[j]]=[arr[j],arr[i]]; saveKey(KEYS.settings,SETTINGS); }
function removeNavItem(i){ SETTINGS.nav.splice(i,1); saveKey(KEYS.settings,SETTINGS); }

function editNavItem(i){
  const n = i>=0 ? SETTINGS.nav[i] : {label:'',url:'',newTab:false};
  showModal(`<h2>${i>=0?'Edit Link':'Add Link'}</h2>
    <form onsubmit="event.preventDefault(); saveNavItem(${i}, this);">
      <div class="form-grid">
        <div class="field"><label>Label</label><input required type="text" name="label" value="${esc(n.label)}"></div>
        <div class="field"><label>URL</label><input required type="text" name="url" value="${esc(n.url)}"></div>
        <div class="field full"><label class="checkline"><input type="checkbox" name="newTab" ${n.newTab?'checked':''}> Open in new tab</label></div>
      </div>
      <div class="modal-close-row"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn">Save</button></div>
    </form>`);
}

function saveNavItem(i, form){
  const fd = new FormData(form);
  const item = {id: i>=0? SETTINGS.nav[i].id : uid(), label: fd.get('label').trim(), url: fd.get('url').trim(), newTab: fd.get('newTab')==='on'};
  if(i>=0) SETTINGS.nav[i] = item; else SETTINGS.nav.push(item);
  saveKey(KEYS.settings, SETTINGS); closeModal();
}

async function addMediaByUrl(){
  const input=document.getElementById('media-url-input');
  const url=input&&input.value.trim();
  if(!url){toast('Please enter an image URL');return;}
  if(!isValidHttpUrl(url) && !url.startsWith('data:image/')){toast('Please enter a valid image URL');return;}
  MEDIA.push({id:uid(),name:url,dataUrl:url});
  await saveKey(KEYS.media,MEDIA);
  input.value='';
  toast('Image added to Media Library ✓');
}

function deleteMedia(id){
  if(!confirm('Delete this image?')) return;
  MEDIA = MEDIA.filter(m=>m.id!==id);
  saveKey(KEYS.media, MEDIA);
}

function savePageForm(id,isNew,form){
  const fd=new FormData(form),title=String(fd.get('title')||'').trim();

  if(duplicate){ toast('A page with this slug already exists. Please use a different slug.'); return; }
  const page=isNew?{id,title,slug:'',content:'',status:'published',style:{}}:PAGES.find(x=>x.id===id);
  if(!page){toast('Page could not be found');return;}
  Object.assign(page,{title,slug,content:String(fd.get('content')||'').trim(),status:fd.get('status'),
    style:{background:fd.get('background')||'',textColor:fd.get('textColor')||'',border:fd.get('border')||'',radius:Number(fd.get('radius'))||0,padding:Number(fd.get('padding'))||30,width:fd.get('width')||'100%',buttonBg:fd.get('buttonBg')||'#F57224',buttonColor:fd.get('buttonColor')||'#FFFFFF',buttonBorder:fd.get('buttonBorder')||'#F57224'}});
  if(isNew)PAGES.push(page);
  normalizeCloudState();

/* ---------- Long-session / network recovery ---------- */
let StoreX_RECOVERY_TIMER=null;
async function refreshCloudStateAfterResume(){
  if(!supabaseClient || !SUPABASE_READY || document.hidden) return;
  try{
    const demo=buildDemoConfig();
    SETTINGS=await loadKey(KEYS.settings,demo.settings);
    PRODUCTS=await loadKey(KEYS.products,demo.products);
    CATEGORIES=await loadKey(KEYS.categories,demo.categories);
    FLASHSALES=await loadKey(KEYS.flashsales,demo.flashsales);
    BANNERS=await loadKey(KEYS.banners,demo.banners);
    MEDIA=await loadKey(KEYS.media,demo.media);
    PAGES=await loadKey(KEYS.pages,demo.pages);
    normalizeCloudState();
    applyTheme();
    render();
    subscribeRealtime();
  }catch(err){ console.warn('StoreX resume sync skipped:',err); }
}
window.addEventListener('online',refreshCloudStateAfterResume);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refreshCloudStateAfterResume(); });
StoreX_RECOVERY_TIMER=setInterval(()=>{ if(!document.hidden) refreshCloudStateAfterResume(); },15*60*1000);


/* Cross-tab cache sync: if another tab receives a cloud update, this tab
   refreshes from the newest local snapshot without a hard browser reload. */
(function(){
  window.addEventListener('storage', function(e){
    if(e.key !== 'StoreX.customer.snapshot.v4' || !e.newValue) return;
    if(location.hash && location.hash.startsWith('#/admin-of-storex')) return;
    try{
      const item=JSON.parse(e.newValue);
      const c=item && item.data;
      if(!c) return;
      if(c.settings) SETTINGS=c.settings;
      if(Array.isArray(c.products)) PRODUCTS=c.products;
      if(Array.isArray(c.categories)) CATEGORIES=c.categories;
      if(Array.isArray(c.flashsales)) FLASHSALES=c.flashsales;
      if(Array.isArray(c.banners)) BANNERS=c.banners;
      if(Array.isArray(c.media)) MEDIA=c.media;
      if(Array.isArray(c.pages)) PAGES=c.pages;
      normalizeCloudState();
      applyTheme();
      render();
      applyMediaSizing();
      initLazyMedia();
    }catch(err){ console.warn('StoreX cross-tab cache sync skipped:',err); }
  });
})();

/* ================= INIT ================= */
window.addEventListener('error', function(e){
  console.error('StoreX runtime error:', e.error || e.message);
});
window.addEventListener('unhandledrejection', function(e){
  console.error('StoreX promise error:', e.reason);
});
boot().catch(function(err){
  console.error('StoreX boot failed:',err);
  safeRenderFallback('Store is temporarily unavailable.');
});
