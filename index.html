<script>
/* ================= StoreX CUSTOMER CACHE =================
   Fast repeat visits:
   1) Last complete cloud state is stored in localStorage.
   2) The cached storefront renders immediately on repeat visits.
   3) Supabase is then read in the background and the screen is refreshed.
   4) Realtime changes replace the current screen without requiring a manual reload.
*/
(function(){
  'use strict';
  const KEY = 'StoreX.customer.snapshot.v5';
  const MAX_AGE = 1000 * 60 * 60 * 24 * 30; // keep a snapshot for up to 30 days

  window.StoreXCustomerCache = {
    read(){
      try{
        const raw = localStorage.getItem(KEY);
        if(!raw) return null;
        const item = JSON.parse(raw);
        if(!item || !item.data) return null;
        return item;
      }catch(e){ return null; }
    },
    write(data){
      try{
        localStorage.setItem(KEY, JSON.stringify({
          version:4,
          savedAt:Date.now(),
          data:data
        }));
      }catch(e){
        // Storage can be unavailable/full; the website must still work normally.
      }
    },
    isUsable(item){
      return !!(item && item.data && (Date.now() - (item.savedAt||0)) <= MAX_AGE);
    }
  };
})();
</script>


<script>
/* ================= StoreX PERFORMANCE ENGINE ================= */
window.StoreXPerf=window.StoreXPerf||{};
StoreXPerf.compressImageForWeb=async function(file){
  if(!file||!file.type||!file.type.startsWith('image/')) return file;
  if(file.type==='image/svg+xml'||file.type==='image/gif') return file;
  const MAX_DIM=2400, QUALITY=.92;
  try{
    const bitmap=await createImageBitmap(file);
    const scale=Math.min(1,MAX_DIM/Math.max(bitmap.width,bitmap.height));
    const w=Math.max(1,Math.round(bitmap.width*scale)),h=Math.max(1,Math.round(bitmap.height*scale));
    const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
    const ctx=canvas.getContext('2d',{alpha:true,desynchronized:true}); ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
    ctx.drawImage(bitmap,0,0,w,h); bitmap.close();
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',QUALITY));
    if(!blob||blob.size>=file.size*.98) return file;
    return new File([blob],(file.name||'image').replace(/\.[^.]+$/i,'.webp'),{type:'image/webp',lastModified:Date.now()});
  }catch(e){console.warn('Image optimization skipped:',e);return file;}
};
StoreXPerf.fastPublicState=async function(){
  if(!supabaseClient||!SUPABASE_READY) return null;
  try{ const {data,error}=await supabaseClient.rpc('storex_public_state'); if(error) throw error; return data&&typeof data==='object'?data:null; }
  catch(e){console.warn('Fast public state RPC unavailable; using existing reads:',e);return null;}
};
</script>

     Edit the values inside SEO_CONFIG below. Keep the main description
     natural and unique; use keywords only where they genuinely describe
     the page. This configuration is also used by the dynamic SEO updater.
=================================================================== -->
<script>
const SEO_CONFIG = {
  siteName: "StoreX",
  siteUrl: "https://StoreX/",
  defaultTitle: "StoreX | Discover Products, Deals & Trending Finds",
  defaultDescription: "StoreX is an online product discovery store featuring trending products, electronics, fashion, beauty, home and living essentials, gadgets, accessories and more. Discover useful products, compare options and visit trusted shopping destinations through our product links.",
  keywords: "StoreX, StoreX, online shopping, trending products, best products, product discovery, electronics, gadgets, mobile accessories, fashion, beauty products, home and living, kitchen products, lifestyle products, accessories, online deals, trending deals, shopping deals, useful products, Pakistan online shopping",
  robots: "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1",
  language: "en",
  themeColor: "#F57224",
  socialTitle: "StoreX | Discover Products, Deals & Trending Finds",
  socialDescription: "Discover trending products, electronics, fashion, beauty, home essentials, gadgets and more at StoreX."
};

(function applyStaticSEO(){
  const c = SEO_CONFIG;
  document.title = c.defaultTitle;

  const setMeta = (name, content, attr="name") => {
    let el = document.head.querySelector(`meta[${attr}="${name}"]`);
    if (!el) {
      el = document.createElement("meta");
      el.setAttribute(attr, name);
      document.head.appendChild(el);
    }
    el.setAttribute("content", content);
  };

  setMeta("description", c.defaultDescription);
  setMeta("keywords", c.keywords);
  setMeta("robots", c.robots);
  setMeta("og:title", c.socialTitle, "property");
  setMeta("og:description", c.socialDescription, "property");
  setMeta("og:type", "website", "property");
  setMeta("og:url", c.siteUrl, "property");
  setMeta("twitter:card", "summary_large_image");
  setMeta("twitter:title", c.socialTitle);
  setMeta("twitter:description", c.socialDescription);
  setMeta("theme-color", c.themeColor);

  let canonical = document.head.querySelector('link[rel="canonical"]');
  if (!canonical) {
    canonical = document.createElement("link");
    canonical.rel = "canonical";
    document.head.appendChild(canonical);
  }
  canonical.href = c.siteUrl;

  let lang = document.documentElement;
  if (lang) lang.lang = c.language;
})();
</script>

@media (max-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:8px;} .grid.cols-2{grid-template-columns:repeat(2,1fr);} .grid.cols-4{grid-template-columns:repeat(3,1fr);}}
@media (max-width:480px){.grid.compact-fallback{grid-template-columns:repeat(2,1fr);gap:10px;} .grid.cols-4{grid-template-columns:repeat(2,1fr);}}
.spotlight-card{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.spotlight-card .spotlight-img{aspect-ratio:1/1;background:#F2F0EB;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.spotlight-card .spotlight-img img{width:100%;height:100%;object-fit:contain;}
.spotlight-card .spotlight-body{padding:26px 30px;display:flex;flex-direction:column;justify-content:center;gap:10px;}
.spotlight-card .spotlight-body h3{font-size:24px;margin:0;font-weight:700;}
.spotlight-card .spotlight-body .price{font-size:22px;}
@media (max-width:720px){.spotlight-card{grid-template-columns:1fr;} .spotlight-card .spotlight-body{padding:16px;}}
.cat-showcase-group{margin-bottom:34px;}
.cat-showcase-group:last-child{margin-bottom:0;}
.cat-showcase-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.cat-showcase-head h3{font-size:18px;margin:0;font-weight:700;}
.cat-showcase-head a{font-size:13px;font-weight:600;color:var(--primary);}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,border-color .15s;position:relative;}
.card:hover{border-color:#D8D3C9;box-shadow:0 6px 18px rgba(20,20,20,.07);}
.card-img{aspect-ratio:1/1;background:#F2F0EB;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.card-img img{width:100%;height:100%;object-fit:contain;}
.card-badge{position:absolute;top:8px;left:8px;background:var(--primary);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;z-index:2;}
.card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;flex:1;}
.card-title{font-size:13.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em;}
.card-desc{font-size:12px;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.price-row{display:flex;align-items:baseline;gap:7px;margin-top:2px;}
.price{font-size:16px;font-weight:700;color:var(--ink);}
.price-old{font-size:12px;color:var(--ink-soft);text-decoration:line-through;}
.discount-pill{font-size:11px;font-weight:700;color:#1a7f37;background:#E9F7EE;padding:2px 6px;border-radius:4px;}
.card-cta{margin-top:auto;width:100%;background:var(--primary);color:#fff;border:none;padding:9px;font-size:12.5px;font-weight:700;border-radius:6px;}
.card-cta:hover{background:var(--primary-dark);}
@media (max-width:480px){
  .card-title{font-size:11.5px;min-height:2.2em;}
  .price{font-size:13px;}
  .card-cta{font-size:11px;padding:7px;}
  .card-body{padding:7px 8px 8px;gap:3px;}
}

/* ---------- Categories (box grid) ---------- */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.cat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:8px;transition:box-shadow .15s,border-color .15s;}
.cat-card:hover{border-color:var(--primary);box-shadow:0 6px 18px rgba(20,20,20,.07);}

/* Dynamic full width image container */
.cat-icon{width:100%;max-width:100%;height:130px;background:#F2F0EB;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:24px;border-radius:6px;margin:0 auto;}
.cat-icon img{width:100%;height:100%;object-fit:cover;display:block;}

.cat-name{font-size:13px;font-weight:600;text-align:center;padding:8px 2px 2px 2px;}

/* Mobile responsiveness */
@media (max-width:480px){
  .cat-grid{grid-template-columns:repeat(3,1fr);gap:8px;} 
  .cat-icon{max-width:100%;height:90px;} 
  .cat-name{font-size:11px;padding:5px 2px 0 2px;}
}

/* ---------- Flash sale ---------- */
.flash{background:var(--ink);color:#fff;border-radius:12px;overflow:hidden;position:relative;display:grid;grid-template-columns:1.1fr 1fr;min-height:200px;}
.flash-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.35;}
.flash-info{background:#FFFFFF;color:#1F2328;position:relative;padding:30px;display:flex;flex-direction:column;justify-content:center;gap:10px;}
.flash-eyebrow{color:var(--primary);font-weight:700;font-size:13px;}
.flash-info h3{font-size:26px;margin:0;font-weight:700;}
.flash-info p{margin:0;color:inherit;opacity:.8;font-size:14px;}
.countdown{display:flex;gap:8px;margin-top:6px;}
.countdown .chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:8px 10px;min-width:52px;text-align:center;}
.countdown .chip b{display:block;font-size:19px;font-family:'Space Grotesk';}
.countdown .chip span{font-size:10px;color:rgba(255,255,255,.65);text-transform:uppercase;}
.flash-visual{position:relative;background-color:#FFFFFF;background-position:center;background-repeat:no-repeat;overflow:hidden;}
.flash-visual img{width:100%;height:100%;display:block;object-position:center;}
.flash-visual.fit-cover img{object-fit:cover;}
.flash-visual.fit-contain img{object-fit:contain;}
.flash-visual.fit-stretch img{object-fit:fill;}
.flash-visual-slide{position:absolute;inset:0;background-position:center;background-repeat:no-repeat;background-color:#FFFFFF;opacity:0;transition:opacity .8s ease;}
.flash-visual-slide img{width:100%;height:100%;display:block;object-fit:cover;object-position:center;}
.flash-visual-slide.active{opacity:1;}
@media (max-width:720px){.flash{grid-template-columns:1fr;} .flash-visual{min-height:140px;order:-1;}}
.flash-carousel{position:relative;overflow:hidden;border-radius:12px;}
.flash-track{display:flex;transition:transform .6s ease;}
.flash-slide{flex:0 0 100%;min-width:0;display:block;}
.flash-slide .flash{border-radius:12px;}
.flash-dots{display:flex;gap:6px;justify-content:center;margin-top:10px;}
.flash-dots button{width:8px;height:8px;border-radius:50%;background:var(--line);border:none;padding:0;}
.flash-dots button.active{background:var(--primary);width:20px;border-radius:5px;}

/* ---------- Banner ---------- */
.promo-banner{border-radius:12px;overflow:hidden;background:#F2F0EB;position:relative;min-height:160px;display:flex;align-items:center;background-size:cover;background-position:center;}
.promo-banner-inner{position:relative;padding:30px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.4);}
.promo-banner-inner h3{margin:0 0 6px;font-size:22px;}
.promo-banner-inner p{margin:0 0 14px;font-size:14px;}
.promo-banner-overlay{position:absolute;inset:0;background:rgba(0,0,0,.25);}

/* ---------- Footer ---------- */
#site-footer{background:#F57224;color:#FFFFFF;margin-top:60px;}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:30px;padding:44px 0 24px;}
.footer-grid h4{color:#FFFFFF;font-size:14px;margin:0 0 12px;}
.footer-grid a{display:block;font-size:13.5px;padding:4px 0;color:#FFFFFF;}
.footer-grid a:hover{color:#FFFFFF;text-decoration:underline;}
.footer-bottom{border-top:1px solid rgba(255,255,255,.28);padding:16px 0;font-size:12.5px;color:#FFFFFF;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.social-row{display:flex;gap:10px;margin-top:10px;}
.social-row a{width:32px;height:32px;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;font-size:13px;color:#FFFFFF;overflow:hidden;}
.social-row a img{width:32px;height:32px;object-fit:contain;display:block;background:transparent;}
@media (max-width:720px){.footer-grid{grid-template-columns:1fr 1fr;}}

/* ---------- Empty / error states ---------- */
.empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
.empty-state .icon{font-size:40px;margin-bottom:10px;}
.empty-state h3{color:var(--ink);margin:0 0 6px;}

/* ---------- Breadcrumb ---------- */
.crumb{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;}
.crumb a:hover{color:var(--primary);}

/* ---------- Product detail ---------- */
.pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;}
@media (max-width:820px){.pd-grid{grid-template-columns:1fr;gap:20px;}}
.pd-main-img{background:#F2F0EB;border-radius:10px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.pd-main-img img{width:100%;height:100%;object-fit:contain;}
.pd-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.pd-thumbs img{width:60px;height:60px;object-fit:cover;border-radius:6px;border:1.5px solid var(--line);cursor:pointer;}
.pd-thumbs img.active{border-color:var(--primary);}
.pd-title{font-size:26px;margin:0 0 8px;font-weight:700;}
.pd-tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;}
.tag-pill{font-size:11.5px;background:#F2F0EB;padding:3px 9px;border-radius:20px;color:var(--ink-soft);}
.pd-desc{color:var(--ink-soft);font-size:14.5px;margin:14px 0;white-space:pre-line;}

/* ---------- Admin ---------- */
.admin-shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh;background:#F3F2EF;}
.admin-sidebar{background:#1F2328;color:#D4D6D9;padding:20px 14px;}
.admin-sidebar .brand{color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:19px;margin-bottom:20px;padding:0 6px;}
.admin-sidebar .brand .x{color:var(--primary);}
.admin-sidebar a,.admin-sidebar button.navlink{display:block;width:100%;text-align:left;background:none;border:none;color:#B7BABE;padding:9px 10px;border-radius:6px;font-size:13.5px;font-weight:600;margin-bottom:2px;}
.admin-sidebar a:hover,.admin-sidebar button.navlink:hover{background:#2C3036;color:#fff;}
.admin-sidebar a.active,.admin-sidebar button.navlink.active{background:var(--primary);color:#fff;}
.admin-sidebar .group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#71757B;margin:16px 6px 6px;}
.admin-main{padding:26px 30px;overflow-x:auto;}
.admin-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
.admin-topbar h1{font-size:22px;margin:0;}
.admin-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:18px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px;}
.stat-box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;}
.stat-box b{font-size:26px;display:block;font-family:'Space Grotesk';}
.stat-box span{font-size:12.5px;color:var(--ink-soft);}
.admin-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.admin-table th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);color:var(--ink-soft);font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
.admin-table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
.admin-table img{width:40px;height:40px;object-fit:cover;border-radius:4px;}
.row-actions{display:flex;gap:6px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:700px){.form-grid{grid-template-columns:1fr;}}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:2px;}
.field.full{grid-column:1/-1;}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.field input[type=text],.field input[type=number],.field input[type=url],.field input[type=password],.field input[type=datetime-local],.field select,.field textarea{
  border:1.5px solid var(--line);border-radius:6px;padding:9px 10px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink);
}
.field textarea{resize:vertical;min-height:70px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);}
.checkline{display:flex;align-items:center;gap:8px;font-size:13.5px;}
.badge-status{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;}
.badge-status.on{background:#E9F7EE;color:#1a7f37;}
.badge-status.off{background:#F1EFEA;color:#8A8D91;}
.modal-overlay{position:fixed;inset:0;background:rgba(20,20,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:100;}
.modal-box{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:640px;}
.modal-box h2{margin:0 0 16px;font-size:19px;}
.modal-close-row{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);}
.section-list-item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px;cursor:grab;}
.section-list-item.dragging{opacity:.4;}
.section-list-item .handle{color:var(--ink-soft);font-size:16px;}
.section-list-item .meta{flex:1;}
.section-list-item .meta b{font-size:13.5px;}
.section-list-item .meta div{font-size:11.5px;color:var(--ink-soft);}
.thumb-picker{display:flex;flex-wrap:wrap;gap:8px;}
.thumb-picker .t{width:64px;height:64px;border:2px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;}
.thumb-picker .t.sel{border-color:var(--primary);}
.thumb-picker .t img{width:100%;height:100%;object-fit:cover;}
.upload-box{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;font-size:12.5px;color:var(--ink-soft);}
.upload-note{font-size:11.5px;color:var(--primary-dark);background:#FFF4EA;border:1px solid #F5D8B8;padding:6px 9px;border-radius:6px;margin-top:8px;text-align:left;}
.seo-fieldset{border:1px dashed var(--line);border-radius:8px;padding:14px;margin-top:6px;}
.seo-fieldset legend{font-size:12.5px;font-weight:700;color:var(--ink-soft);padding:0 6px;}
.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1F2328;}
.login-card{background:#fff;border-radius:12px;padding:34px;width:100%;max-width:360px;}
.swatch{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid var(--line);vertical-align:middle;margin-right:6px;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-size:13.5px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.25);}
.help-note{font-size:12px;color:var(--ink-soft);background:#FFF8EE;border:1px solid #F0DDBB;padding:8px 10px;border-radius:6px;margin-bottom:14px;}
.admin-hamburger{display:none;}
.admin-drawer-overlay{display:none;}
@media (max-width:900px){

  .admin-hamburger svg{width:22px;height:22px;}
  .admin-drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;}

  .admin-sidebar{position:fixed;top:0;left:0;height:100%;width:80%;max-width:290px;z-index:65;padding:20px 14px;overflow-y:auto;transform:translateX(-105%);transition:transform .25s ease;display:block;}
  .admin-sidebar.open{transform:translateX(0);}
  .admin-sidebar .group-label{display:block;}
  .admin-main{padding:70px 16px 26px;}
}

/* StoreX category media: fixed 3:2 ratio on desktop, tablet and mobile */
.cat-icon{height:auto !important;min-height:0 !important;aspect-ratio:3/2 !important;}
.cat-icon img{width:100%;height:100%;object-fit:cover;}
@media(max-width:480px){.cat-icon{height:auto !important;min-height:0 !important;aspect-ratio:3/2 !important;}}

/* StoreX unified media + navigation fixes */
html{scroll-behavior:auto;}
.card-img,.cat-icon,.pd-main-img,.spotlight-img{width:100%;}
.card-img{aspect-ratio:var(--product-media-ratio,1/1)!important;height:auto!important;}
.card-img img,.cat-icon img,.pd-main-img img,.spotlight-img img{width:100%;height:100%;object-fit:cover;}
.flash{aspect-ratio:3/2!important;height:auto!important;min-height:0!important;}
.flash-visual{height:100%!important;min-height:0!important;}

.card-img,.spotlight-card .spotlight-img,.pd-main-img{contain:layout paint;}
.hero,.promo-banner{contain:paint;}
.flash{grid-template-columns:1fr !important;grid-template-rows:auto auto !important;min-height:0 !important;height:auto !important;aspect-ratio:auto !important;background:#fff !important;color:var(--ink) !important;}
.flash-visual{width:100% !important;aspect-ratio:3/2 !important;min-height:0 !important;height:auto !important;background:#fff;display:block;position:relative;overflow:hidden;order:1 !important;}
.flash-visual-slide{position:absolute !important;inset:0 !important;width:100%;height:100% !important;display:none;opacity:1 !important;background:#fff;}
.flash-visual-slide.active{display:block;}
.flash-visual-slide img,.flash-visual>img{width:100% !important;height:100% !important;object-fit:contain !important;object-position:center !important;background:#fff;display:block;}
.flash-info{order:2 !important;width:100% !important;box-sizing:border-box;min-width:0;background:#fff !important;color:var(--ink) !important;padding:20px 22px 22px !important;display:flex;flex-direction:column;justify-content:center;gap:9px;}

/* ---------- Website analytics: page views / visitor sessions ---------- */
let SITE_ANALYTICS_SESSION='';
let SITE_ANALYTICS_LAST_TOKEN='';
function getSiteAnalyticsSession(){
  try{ let v=sessionStorage.getItem('StoreX.siteAnalyticsSession.v1'); if(!v){v=uid();sessionStorage.setItem('StoreX.siteAnalyticsSession.v1',v);} return v; }catch(_){ return uid(); }
}
async function storexBaseTrackSitePageView(){
  const path=route(); if(path.startsWith('/admin-of-storex')) return;
  const session=getSiteAnalyticsSession();
  const token=session+'|'+path;
  if(SITE_ANALYTICS_LAST_TOKEN===token)return;
  SITE_ANALYTICS_LAST_TOKEN=token;
  if(!supabaseClient||!SUPABASE_READY)return;
  try{
    const modern=await supabaseClient.from('storex_site_analytics').insert({event_type:'page_view',visitor_key:session,page_path:path,session_key:session,event_date:new Date().toISOString().slice(0,10),metadata:{},created_at:new Date().toISOString()});
    if(modern.error){
      const legacy=await supabaseClient.from('storex_site_analytics').insert({session_id:session,path,viewed_at:new Date().toISOString()});
      if(legacy.error)throw legacy.error;
    }
  }catch(e){ console.warn('Site analytics event skipped:',e); }
}
async function fetchSiteAnalytics(start,end){
  if(!supabaseClient||!SUPABASE_READY)return [];
  const rows=[]; let from=0,step=1000;
  while(true){
    let data,error;
    const modern=await supabaseClient.from('storex_site_analytics').select('visitor_key,page_path,session_key,event_date,created_at').eq('event_type','page_view').gte('created_at',start.toISOString()).lt('created_at',end.toISOString()).order('created_at',{ascending:true}).range(from,from+step-1);
    data=modern.data; error=modern.error;
    if(error){
      const legacy=await supabaseClient.from('storex_site_analytics').select('session_id,path,viewed_at').gte('viewed_at',start.toISOString()).lt('viewed_at',end.toISOString()).order('viewed_at',{ascending:true}).range(from,from+step-1);
      if(legacy.error)throw legacy.error;
      data=(legacy.data||[]).map(r=>({visitor_key:r.session_id,page_path:r.path,session_key:r.session_id,event_date:String(r.viewed_at||'').slice(0,10),created_at:r.viewed_at}));
    }else data=(data||[]).map(r=>({visitor_key:r.visitor_key,page_path:r.page_path,session_key:r.session_key,event_date:r.event_date,created_at:r.created_at}));
    const batch=data||[]; rows.push(...batch); if(batch.length<step)break; from+=step; if(from>100000)break;
  }
  return rows;
}
function analyticsRange(period,startDate,endDate){
  const now=new Date(); now.setHours(23,59,59,999);
  if(period==='yesterday'){const e=new Date(now);e.setDate(e.getDate()-1);const s=new Date(e);s.setHours(0,0,0,0);return [s,new Date(now.getFullYear(),now.getMonth(),now.getDate(),0,0,0,0)];}
  if(period==='7d'){const s=new Date(now);s.setDate(s.getDate()-6);s.setHours(0,0,0,0);return [s,new Date(now.getTime()+1)];}
  if(period==='30d'){const s=new Date(now);s.setDate(s.getDate()-29);s.setHours(0,0,0,0);return [s,new Date(now.getTime()+1)];}
  if(period==='specific'&&startDate){const s=new Date(startDate+'T00:00:00');const e=new Date((endDate||startDate)+'T00:00:00');e.setDate(e.getDate()+1);return [s,e];}
  if(period==='all'){return [new Date('2020-01-01T00:00:00'),new Date(now.getTime()+1)];}
  const s=new Date(now);s.setHours(0,0,0,0);return [s,new Date(now.getTime()+1)];
}
async function loadAnalyticsDashboard(){
  const period=document.getElementById('analytics-period')?.value||'today';
  const start=document.getElementById('analytics-start')?.value||'';
  const end=document.getElementById('analytics-end')?.value||'';
  const [a,b]=analyticsRange(period,start,end);
  try{
    const rows=await fetchSiteAnalytics(a,b);
    const visitors=new Set(rows.map(r=>String(r.visitor_key||r.session_key||'')).filter(Boolean)).size;
    const views=rows.length;
    const byDay={}; rows.forEach(r=>{const d=new Date(r.created_at).toLocaleDateString('en-CA');byDay[d]=(byDay[d]||0)+1;});
    const orders=ORDERS.filter(o=>{const t=new Date(o.created_at||0);return t>=a&&t<b;});
    const shipped=orders.filter(o=>['shipped','delivered'].includes(String(o.status||'').toLowerCase()) && String(o.status||'').toLowerCase()!=='returned');
    const returned=orders.filter(o=>String(o.status||'').toLowerCase()==='returned');
    const root=document.getElementById('analytics-results'); if(!root)return;
    root.innerHTML=`<div class="admin-card" style="margin-top:12px;"><div class="admin-stats-grid"><div class="admin-stat"><b>${views.toLocaleString()}</b><span>Page views</span></div><div class="admin-stat"><b>${visitors.toLocaleString()}</b><span>Visitors</span></div><div class="admin-stat"><b>${orders.length.toLocaleString()}</b><span>Orders</span></div><div class="admin-stat"><b>${shipped.length.toLocaleString()}</b><span>Shipped / delivered</span></div><div class="admin-stat"><b>${returned.length.toLocaleString()}</b><span>Returned</span></div></div><h3 style="margin:18px 0 8px;">Daily breakdown</h3><div style="overflow:auto;"><table class="admin-table"><thead><tr><th>Date</th><th>Views</th></tr></thead><tbody>${Object.keys(byDay).sort().reverse().map(d=>`<tr><td>${esc(d)}</td><td>${byDay[d]}</td></tr>`).join('')||'<tr><td colspan="2">No website views recorded for this period.</td></tr>'}</tbody></table></div></div>`;
  }catch(e){const root=document.getElementById('analytics-results');if(root)root.innerHTML=`<div class="admin-card"><b>Analytics data is not available yet.</b><p style="color:var(--ink-soft);">Run the supplied Supabase analytics migration once, then refresh this section.</p></div>`;}
}
function adminAnalytics(){

}

/* ---------- Product analytics: one event per real product view / Buy Now click ---------- */
let PRODUCT_ANALYTICS = Object.create(null);
let PRODUCT_ANALYTICS_READY = false;
let PRODUCT_ANALYTICS_CHANNEL = null;
let LAST_TRACKED_PRODUCT_VIEW = '';

function analyticsCounts(p){
  const a=PRODUCT_ANALYTICS[String(p?.id||'')]||{};
  return {views:Math.max(0,Number(a.views??p?.views)||0),clicks:Math.max(0,Number(a.clicks??p?.clicks)||0)};
}
async function loadProductAnalytics(){
  if(!supabaseClient||!SUPABASE_READY)return;
  try{
    const {data,error}=await supabaseClient.from('storex_product_analytics').select('product_id,views,clicks,updated_at');
    if(error)throw error;
    PRODUCT_ANALYTICS=Object.create(null);
    (data||[]).forEach(r=>{PRODUCT_ANALYTICS[String(r.product_id)]={views:Number(r.views)||0,clicks:Number(r.clicks)||0,updated_at:r.updated_at};});
    PRODUCT_ANALYTICS_READY=true;
    if(route().startsWith('/admin-of-storex')) render();
  }catch(e){ console.warn('Product analytics read skipped:',e); }
}
async function trackProductEvent(productId,eventType){
  const id=String(productId||'').trim();
  const type=eventType==='click'?'click':'view';
  if(!id||!supabaseClient||!SUPABASE_READY)return;
  try{
    let data=null;
    const rpc=await supabaseClient.rpc('storex_track_product_event',{p_product_id:id,p_event_type:type});
    if(!rpc.error){
      data=Array.isArray(rpc.data)?rpc.data[0]:rpc.data;
    }else{
      // Fallback for databases where the RPC migration has not been installed.
      const {data:row,error:readError}=await supabaseClient.from('storex_product_analytics')
        .select('product_id,views,clicks,updated_at').eq('product_id',id).maybeSingle();
      if(readError)throw readError;
      const next={
        product_id:id,
        views:Math.max(0,Number(row?.views)||0)+(type==='view'?1:0),
        clicks:Math.max(0,Number(row?.clicks)||0)+(type==='click'?1:0),
        updated_at:new Date().toISOString()
      };
      const {error:writeError}=await supabaseClient.from('storex_product_analytics').upsert(next,{onConflict:'product_id'});
      if(writeError)throw writeError;
      data=next;
    }
    if(data&&data.product_id){
      PRODUCT_ANALYTICS[String(data.product_id)]={views:Number(data.views)||0,clicks:Number(data.clicks)||0,updated_at:data.updated_at};
      const p=PRODUCTS.find(x=>String(x.id)===id);
      if(p){p.views=Number(data.views)||0;p.clicks=Number(data.clicks)||0;}
      if(route().startsWith('/admin-of-storex')) render();
    }
  }catch(e){ console.warn('Product analytics event skipped:',e); }
}
function trackProductViewOnce(productId){

        if(!SUPABASE_ADMIN) return;
        const row=payload.new;
        if(row && row.id){ ORDERS=[row,...ORDERS.filter(x=>String(x.id)!==String(row.id))]; if(route().includes('/admin-of-storex') && (ADMIN_VIEW==='orders'||ADMIN_VIEW==='dashboard')){ loadKey(KEYS.products,PRODUCTS).then(v=>{PRODUCTS=v;render();}).catch(()=>render()); } }
      })
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'storex_orders'},payload=>{
        if(!SUPABASE_ADMIN) return;
        const row=payload.new;
        if(row && row.id){ ORDERS=ORDERS.map(x=>String(x.id)===String(row.id)?row:x); if(route().includes('/admin-of-storex') && (ADMIN_VIEW==='orders'||ADMIN_VIEW==='dashboard')) render(); }
      })
      .subscribe();
    loadProductAnalytics();
    subscribeProductAnalytics();
  }catch(err){ console.warn('StoreX realtime unavailable; normal cloud reads remain available.',err); }
}

async function applyRemoteSetting(key,value){
  const map={settings:'SETTINGS',products:'PRODUCTS',categories:'CATEGORIES',flashsales:'FLASHSALES',banners:'BANNERS',media:'MEDIA',pages:'PAGES'};
  const target=map[key];
  if(!target || value==null) return;
  try{
    const clone=JSON.parse(JSON.stringify(value));
    if(target==='SETTINGS'){
      if(!clone || typeof clone!=='object' || Array.isArray(clone)) return;
      SETTINGS=Object.assign({},DEFAULT_SETTINGS,clone,{hero:Object.assign({},DEFAULT_SETTINGS.hero,clone.hero||{}),footer:Object.assign({},DEFAULT_SETTINGS.footer,clone.footer||{},{social:Object.assign({},DEFAULT_SETTINGS.footer.social,(clone.footer&&clone.footer.social)||{})}),search:Object.assign({},DEFAULT_SETTINGS.search,clone.search||{}),darazPromo:Object.assign({},DEFAULT_SETTINGS.darazPromo,clone.darazPromo||{}),mediaSizing:Object.assign({},DEFAULT_SETTINGS.mediaSizing,clone.mediaSizing||{})});
    }else{
      if(!Array.isArray(clone)) return;
      window[target]=clone;
    }
    normalizeCloudState();
    applyTheme();
    try{
      if(window.StoreXCustomerCache){
        window.StoreXCustomerCache.write({
          settings:SETTINGS,
          products:PRODUCTS,
          categories:CATEGORIES,
          flashsales:FLASHSALES,
          banners:BANNERS,
          media:MEDIA,
          pages:PAGES
        });
      }
    }catch(e){}
    if(!route().startsWith('/admin-of-storex')){
      render();
      applyMediaSizing();
      initLazyMedia();
    }
  }catch(err){ console.warn('Ignored malformed StoreX realtime payload:',key,err); }
}

async function loadKey(key,fallback){
  if(!SUPABASE_READY) return JSON.parse(JSON.stringify(fallback));
  try{
    const cloudKey=SUPA_SETTING_KEYS[key.replace('storex-','').replace('-v2','')]||key;
    const {data,error}=await supabaseClient.from('sx_settings').select('value').eq('key',cloudKey).maybeSingle();
    if(error) throw error;
    return data && data.value!=null ? JSON.parse(JSON.stringify(data.value)) : JSON.parse(JSON.stringify(fallback));
  }catch(e){
    console.warn('StoreX cloud read failed for',key,e);
    return JSON.parse(JSON.stringify(fallback));
  }
}

async function saveKey(key,val,options={}){
  if(!SUPABASE_READY){ toast('Supabase is not connected. Change was not saved.'); return false; }
  if(!SUPABASE_ADMIN){ toast('Admin session required. Please log in again.'); return false; }
  const cloudKey=SUPA_SETTING_KEYS[key.replace('storex-','').replace('-v2','')]||key;
  try{
    const {error}=await supabaseClient.from('sx_settings').upsert({key:cloudKey,value:JSON.parse(JSON.stringify(val)),updated_at:new Date().toISOString()},{onConflict:'key'});
    if(error) throw error;
    applyTheme();
    if(!options.silent) render();
    return true;
  }catch(e){
    console.error('StoreX cloud save failed:',e);
    toast('Cloud save failed: '+(e.message||'Unknown Supabase error'));
    return false;
  }
}

async function uploadImageToSupabase(file){
  if(!SUPABASE_READY || !supabaseClient) throw new Error('Supabase is not connected.');
  if(!SUPABASE_ADMIN) throw new Error('Admin login is required to upload images.');
  if(!file || !file.type.startsWith('image/')) throw new Error('Please select an image file.');
  const optimized=await StoreXPerf.compressImageForWeb(file);
  const safeName=(optimized.name||file.name||'image').replace(/[^A-Za-z0-9._-]+/g,'-');
  const path='uploads/'+Date.now().toString(36)+'-'+uid()+'-'+safeName;
  const {error}=await supabaseClient.storage.from(SUPABASE_BUCKET).upload(path,optimized,{contentType:optimized.type||file.type||'application/octet-stream',upsert:false,cacheControl:'31536000'});
  if(error) throw error;
  const {data}=supabaseClient.storage.from(SUPABASE_BUCKET).getPublicUrl(path);
  if(!data?.publicUrl) throw new Error('Supabase did not return a public image URL.');
  return data.publicUrl;
}

async function rememberMediaUrl(url,name){
  if(!url)return;
  if(!Array.isArray(MEDIA))MEDIA=[];
  if(!MEDIA.some(m=>m.dataUrl===url || m.name===url || m.publicUrl===url)){
    MEDIA.push({id:uid(),name:name||url,dataUrl:url,publicUrl:url});
    await saveKey(KEYS.media,MEDIA);
  }
}

async function submitStoreOrder(productId, qty, customer, couponCode=''){
  const p=PRODUCTS.find(x=>x.id===productId);
  if(!p) throw new Error('Product not found.');
  const stock=Math.max(0,Number(p.stock)||0);
  const quantity=Math.max(1,Math.min(Number(qty)||1,stock||Number(qty)||1));
  if(stock>0 && quantity>stock) throw new Error('Requested quantity is greater than available stock.');
  const calc=calculateOrder(p,quantity);
  let couponDiscount=0, freeShipping=false, coupon=null;
  if(couponCode){
    const lines=[{line:{qty:quantity},info:{p,unit:calc.unitPrice}}];
    const subtotal=calc.unitPrice*quantity;
    const v=await validateCoupon(couponCode,lines,subtotal);
    if(!v.ok) throw new Error(v.message);
    coupon=v.coupon;
    const cc=computeCouponDiscount(coupon,lines,subtotal); couponDiscount=cc.discount; freeShipping=cc.freeShipping;
  }
  const delivery=freeShipping?0:calc.delivery;
  const total=Math.max(0,calc.unitPrice*quantity-calc.promotionDiscount-couponDiscount)+delivery;
  if(!supabaseClient || !SUPABASE_READY) throw new Error('Order service is temporarily unavailable.');
  const orderNumber='SX-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,8).toUpperCase();
  const payload={order_number:orderNumber,product_id:p.id,product_title:p.title,product_sku:p.sku||null,quantity,unit_price:calc.unitPrice,original_price:calc.originalPrice,special_price:calc.specialPrice,discount_percent:calc.discountPercent,delivery_charges:delivery,discount_amount:Math.round((calc.discountAmount+couponDiscount)*100)/100,total_amount:Math.round(total*100)/100,customer_name:customer.name,customer_phone:customer.phone,customer_email:customer.email||null,city:customer.city,customer_address:customer.address,status:'pending',promotion:normalizeOrderPromotion(buildOrderPromotionJson(calc.promotion, coupon?.code||'', calc.promotionDiscount, !!(freeShipping || (calc.delivery===0 && Number(p.deliveryCharges||0)>0))))};
  let created=false;
  try{
    const rpc=await supabaseClient.rpc('storex_create_order_and_decrement_stock',{p_order:payload});
    if(!rpc.error){created=true;}
    else if(!String(rpc.error.message||'').toLowerCase().includes('function')) throw rpc.error;
  }catch(e){
    if(!String(e?.message||'').toLowerCase().includes('function') && !String(e?.code||'').toLowerCase().includes('pgrst202')) throw e;
  }
  if(!created){
    const {error}=await supabaseClient.from('storex_orders').insert(payload);
    if(error) throw error;
    // Optimistic local update for this browser; the companion stock RPC makes the cloud value authoritative.
    p.stock=Math.max(0,(Number(p.stock)||0)-quantity);
  }else{
    p.stock=Math.max(0,(Number(p.stock)||0)-quantity);
  }
  if(coupon){try{await supabaseClient.from('storex_coupon_usage').insert({coupon_code:coupon.code,customer_phone:customer.phone,customer_email:customer.email||null,order_number:orderNumber});}catch(e){console.warn('Coupon usage log skipped:',e);}}
  return {order_number:orderNumber,created_at:new Date().toISOString(),couponCode:coupon?.code||'',couponDiscount,delivery,total};
}
function calculateOrder(p,quantity){
  const original=Number(p.originalPrice ?? p.oldPrice ?? p.price)||0;
  const special=Number(p.specialPrice ?? p.price)||original;
  const unit=Math.min(original||special,special||original);
  const discountAmount=Math.max(0,(original-unit)*quantity);
  const discountPercent=original>0?Math.round((original-unit)/original*100):0;
  const promo=p.promotion||{};
  let delivery=Math.max(0,Number(p.deliveryCharges)||0);
  let promoDiscount=0, promoText='';
  if(promo.freeDelivery && quantity>=Math.max(1,Number(promo.freeDeliveryQty)||1)){delivery=0;promoText='Free delivery';}
  if(Number(promo.percentOff)>0 && quantity>=Math.max(1,Number(promo.percentOffQty)||1)){
    promoDiscount=Math.round(unit*quantity*Number(promo.percentOff)/100*100)/100; promoText=(promo.percentOff+'% off');
  }
  let bonus=0;
  if(Number(promo.buyQty)>0 && Number(promo.freeQty)>0 && quantity>=Number(promo.buyQty)){
    bonus=Math.floor(quantity/Number(promo.buyQty))*Number(promo.freeQty); promoText=(promoText?promoText+' + ':'')+'Buy '+promo.buyQty+' Get '+promo.freeQty+' Free';
  }
  const subtotal=Math.max(0,unit*quantity-promoDiscount);
  return {originalPrice:original,specialPrice:special,unitPrice:unit,discountAmount:Math.round((discountAmount+promoDiscount)*100)/100,promotionDiscount:promoDiscount,discountPercent,promotion:promoText||null,bonusQuantity:bonus,delivery,total:Math.round((subtotal+delivery)*100)/100};
}

/* ---------- Product promotion totals for cart/checkout ---------- */
function computeProductPromotionTotals(lines){
  let discount=0;
  let freeShipping=false;
  const applied=[];
  for(const x of (lines||[])){
    if(!x || !x.info || !x.info.p) continue;
    const qty=Math.max(1,Number(x.line?.qty)||1);
    const calc=calculateOrder(x.info.p,qty);
    discount+=Number(calc.promotionDiscount)||0;
    const configuredDelivery=Math.max(0,Number(x.info.p.deliveryCharges)||0);
    const promo=x.info.p.promotion||{};
    if(Boolean(promo.freeDelivery) && Number(promo.freeDeliveryQty)>0 && qty>=Number(promo.freeDeliveryQty) && configuredDelivery>0){
      freeShipping=true;
    }
    if(calc.promotion) applied.push({productId:x.info.p.id,text:calc.promotion,discount:Number(calc.promotionDiscount)||0});
  }
  return {discount:Math.round(discount*100)/100,freeShipping,applied};
}
function buildOrderPromotionJson(productPromotionText, couponCode, productPromotionDiscount, freeDelivery){
  const productText=String(productPromotionText||'').trim();
  const coupon=String(couponCode||'').trim();
  if(!productText && !coupon && !(Number(productPromotionDiscount)>0) && !freeDelivery) return null;
  return {
    product_promotion: productText||null,
    product_promotion_discount: Math.round((Number(productPromotionDiscount)||0)*100)/100,
    coupon_code: coupon||null,
    free_delivery: !!freeDelivery
  };
}

/* Keep the checkout payload JSONB-compatible even if an older/local value
   happens to contain promotion as a plain string. */
function normalizeOrderPromotion(value){
  if(value==null || value==='') return null;
  if(typeof value==='string'){
    const text=value.trim();
    if(!text) return null;
    try{
      const parsed=JSON.parse(text);
      return parsed==null?'':parsed;
    }catch(_){
      return text;
    }
  }
  return value;
}

function money(n){return 'Rs. '+Number(n||0).toLocaleString('en-PK',{maximumFractionDigits:2});}
function formatOrderStatus(s){
  const v=String(s||'pending').toLowerCase();
  return v==='confirmed'?'Confirmed':v==='ready_to_ship'?'Ready to Ship':v==='shipped'?'Shipped':v==='delivered'?'Delivered':v==='cancelled'?'Cancelled':v==='return_requested'?'Return Requested':v==='returned'?'Returned':'Pending';
}
function customerCanCancelStatus(status){
  const v=String(status||'pending').toLowerCase();
  return ['pending','confirmed'].includes(v);
}
function customerCanRequestReturn(o){
  const status=String(o?.status||'').toLowerCase();
  if(status!=='delivered' || !o?.delivered_at) return false;
  const deliveredAt=new Date(o.delivered_at).getTime();
  if(!Number.isFinite(deliveredAt)) return false;
  return (Date.now()-deliveredAt) >= 0 && (Date.now()-deliveredAt) <= 7*86400000;
}

function renderTrackedOrder(o){

async function submitReturnRequest(orderNumber){

async function cancelTrackedOrder(orderNumber){

  }catch(e){toast(e.message||'Order cancellation failed.');}
}

function loadLazyBackground(el){
  if(!el || el.dataset.lazyLoaded==='1') return;
  const url=el.getAttribute('data-lazy-bg');
  if(!url) return;
  el.style.backgroundImage=`url("${url.replace(/"/g,'\\"')}")`;
  el.dataset.lazyLoaded='1';
  el.removeAttribute('data-lazy-bg');
}

function initLazyMedia(){
  const lazyImages=document.querySelectorAll('img[loading="lazy"]');
  lazyImages.forEach(img=>{ if(!img.getAttribute('src')) img.removeAttribute('loading'); });

  const bgNodes=document.querySelectorAll('[data-lazy-bg]');
  if(!bgNodes.length) return;
  if(!('IntersectionObserver' in window)){ bgNodes.forEach(loadLazyBackground); return; }
  const io=new IntersectionObserver((entries,observer)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        loadLazyBackground(entry.target);
        observer.unobserve(entry.target);
      }
    });
  },{rootMargin:'120px 0px'});
  bgNodes.forEach(el=>io.observe(el));
}

function applyStoreXRouteSEO(pageTitle, pageDescription, pageKeywords, canonicalPath){
  const title = pageTitle ? `${pageTitle} | StoreX` : SEO_CONFIG.defaultTitle;
  const desc = pageDescription || SEO_CONFIG.defaultDescription;
  const keywords = pageKeywords || SEO_CONFIG.keywords;
  document.title = title;

  const set = (name, content, attr="name") => {
    let el=document.head.querySelector(`meta[${attr}="${name}"]`);
    if(!el){ el=document.createElement("meta"); el.setAttribute(attr,name); document.head.appendChild(el); }
    el.setAttribute("content", content || "");
  };
  set("description", desc);
  set("keywords", keywords);
  set("og:title", title, "property");
  set("og:description", desc, "property");
  set("og:url", canonicalPath ? `https://StoreX/${canonicalPath.replace(/^\//,"")}` : SEO_CONFIG.siteUrl, "property");
  set("twitter:title", title);
  set("twitter:description", desc);

  let canonical=document.head.querySelector('link[rel="canonical"]');
  if(!canonical){ canonical=document.createElement("link"); canonical.rel="canonical"; document.head.appendChild(canonical); }
  canonical.href=canonicalPath ? `https://StoreX/${canonicalPath.replace(/^\//,"")}` : SEO_CONFIG.siteUrl;
}

function searchSuggestions(q){
  const query=(q||'').trim().toLowerCase();
  if(!query){return [];}
  const words=query.split(/\s+/).filter(Boolean);
  const configured=SETTINGS.search?.letterSuggestions||{};
  const custom=Object.values(configured).flat();
  const corpus=[...getSearchCorpus(),...custom,...Object.values(BUILTIN_LETTER_SUGGESTIONS).flat()];
  return [...new Set(corpus.filter(Boolean))].map(v=>({v,score:words.reduce((n,w)=>{const x=v.toLowerCase();return n+(x.startsWith(w)?4:(x.includes(w)?2:0));},0)}))
    .filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.v.length-b.v.length)
    .slice(0,Number(SETTINGS.search?.maxSuggestions)||10).map(x=>x.v);
}
function letterSuggestions(){
  const custom=SETTINGS.search?.letterSuggestions||{};
  return Object.fromEntries(Object.keys(BUILTIN_LETTER_SUGGESTIONS).map(k=>[k,[...(custom[k]||[]),...BUILTIN_LETTER_SUGGESTIONS[k]]].filter(Boolean).slice(0,12)));
}

  const wrap=input.closest('.search-wrap');

  if(!box) return;
  const q=String(input.value||'').trim();
  const suggestions=searchSuggestions(q);
  const trends=trendingSearches();
  const values=q ? suggestions : trends;
  if(!values.length){
    box.innerHTML='<div class="search-suggestions-head">Suggestions</div><div style="padding:12px;color:var(--ink-soft);font-size:12px;">No suggestions yet — keep typing or press Search.</div>';
  }else{
    box.innerHTML='<div class="search-suggestions-head">'+(q?'Suggestions':'Trending searches')+'</div>'+values.map(v=>`<button type="button" class="search-suggestion" data-search-value="${esc(v)}" aria-label="Search ${esc(v)}" onclick="event.preventDefault();event.stopPropagation();performSearchQuery(this.getAttribute('data-search-value')||'');"><span>${q?'':'↗ '}${esc(v)}</span><small>${q?'Search':'Trending'}</small></button>`).join('');
  }
  box.classList.add('open');
}

function performSearchQuery(v){
  const query=String(v||'').trim();
  if(!query) return false;
  // Always put the selected keyword into the visible search box first.
  document.querySelectorAll('.search-form input[name="q"]').forEach(input=>{ input.value=query; });
  document.querySelectorAll('.search-suggestions').forEach(box=>box.classList.remove('open'));
  // Keep the search field open on mobile after selecting a suggestion.
  MOBILE_SEARCH_OPEN=true;
  const target='/search?q='+encodeURIComponent(query);
  if(location.hash==='#'+target){
    render();
  }else{
    location.hash=target;
  }
  return false;
}
function useSearchSuggestion(v){
  return performSearchQuery(v);
}

// Search suggestions navigate on click rather than pointerdown. Navigating during pointerdown
// replaces the header DOM before the browser finishes the click, which can make the
// release/click land on the Back button behind the suggestion list.
document.addEventListener('mousedown',function(e){
  const item=e.target.closest?.('.search-suggestion[data-search-value]');
  if(!item) return;
  e.preventDefault();
  e.stopPropagation();
},{passive:false});
document.addEventListener('click',function(e){
  const item=e.target.closest?.('.search-suggestion[data-search-value]');
  if(!item) return;
  e.preventDefault();
  e.stopPropagation();
  performSearchQuery(item.getAttribute('data-search-value')||'');
},{passive:false});
document.addEventListener('touchstart',function(e){
  const item=e.target.closest?.('.search-suggestion[data-search-value]');
  if(!item) return;
  e.stopPropagation();
},{passive:true});
document.addEventListener('click',function(e){
  const item=e.target.closest?.('.search-suggestion[data-search-value]');

},true);

function activeFlashSales(){
  const now = Date.now();
  return FLASHSALES.filter(f=>f.status==='active' && (!f.end || new Date(f.end).getTime()>now));
}
function renderHome(){
  return SETTINGS.sections.filter(s=>s.visible).map(renderSection).join('');
}
function renderSection(sec){
  switch(sec.type){
    case 'hero': return renderHero();
    case 'flashsale': return renderFlashSaleSection(sec);
    case 'categories': return renderCategoriesSection(sec);
    case 'productCollection': return renderCollectionSection(sec);
    case 'categoryShowcase': return renderCategoryShowcaseSection(sec);
    case 'recentlyViewed': return renderRecentlyViewedSection(sec);
    case 'banner': return renderBannerSection(sec);
        case 'customHtml': return `<section class="section container">${sec.config&&sec.config.html||''}</section>`;
    default: return '';
  }
}

function heroSlides(){
  const h = SETTINGS.hero;
  const slides = [];
  const heroDesktop = h.desktopImage || h.image;
  const heroMobile = h.mobileImage || h.image;
  if(heroDesktop || heroMobile){ slides.push({desktop:heroDesktop, mobile:heroMobile}); }
  BANNERS.filter(b=>b.visible && b.heroSlider && (b.image||b.desktopImage||b.mobileImage)).forEach(b=>{
    slides.push({desktop:b.desktopImage||b.image, mobile:b.mobileImage||b.image});
  });
  return slides;
}

function renderHero(){
  const h = SETTINGS.hero;
  if(!h.enabled) return '';
  const slides = heroSlides();
  const bg = slides.length ? `<div class="hero-bg">${slides.map((s,i)=>`
    <div class="hero-bg-slide ${i===0?'active':''}" data-i="${i}">
      ${s.desktop?`<div class="hero-bg-desktop" data-lazy-bg="${esc(mediaSrc(s.desktop))}"></div>`:''}
      ${s.mobile?`<div class="hero-bg-mobile" data-lazy-bg="${esc(mediaSrc(s.mobile))}"></div>`:''}
    </div>`).join('')}</div>` : '';
  const btnAlignMap = {left:'flex-start',center:'center',right:'flex-end'};
  const btnStyle = [
    h.buttonBgColor?`background:${esc(h.buttonBgColor)}`:'',
    h.buttonTextColor?`color:${esc(h.buttonTextColor)}`:'',
    h.buttonWidth?`width:${Number(h.buttonWidth)}px`:'',
    `padding:${Number(h.buttonPaddingY)||12}px ${Number(h.buttonPaddingX)||22}px`,
    `margin-top:${Number(h.buttonMarginTop)||0}px`,
    `align-self:${btnAlignMap[h.buttonAlign]||'flex-start'}`
  ].filter(Boolean).join(';');
  return `
  <section class="hero" style="min-height:${h.height}px;--hero-overlay:${h.overlay};">
    ${bg}<div class="hero-overlay"></div>
    <div class="hero-inner align-${h.align}">
      <h1>${esc(h.heading)}</h1>
      <p>${esc(h.subheading)}</p>
      ${h.buttonText? `<a class="btn" style="${btnStyle}" href="${esc(h.buttonUrl||'#/')}">${esc(h.buttonText)}</a>`:''}
    </div>
  </section>`;
}


function initHeroSlider(){
  if(HERO_SLIDER_TIMER){ clearInterval(HERO_SLIDER_TIMER); HERO_SLIDER_TIMER=null; }
  const wrap = document.querySelector('.hero-bg');
  if(!wrap) return;
  const slides = wrap.querySelectorAll('.hero-bg-slide');
  if(slides.length<2) return;
  let idx = 0;
  HERO_SLIDER_TIMER = setInterval(()=>{
    slides[idx].classList.remove('active');
    idx = (idx+1) % slides.length;
    slides[idx].classList.add('active');
    slides[idx].querySelectorAll('[data-lazy-bg]').forEach(loadLazyBackground);
  }, 5000);
}

function flashImages(f){
  return [f.banner, f.banner2, f.banner3].filter(Boolean).map(mediaSrc).filter(Boolean);
}
function flashVisualHtml(images){
  if(!images.length) return `<div class="flash-visual" aria-hidden="true"></div>`;
  return `<div class="flash-visual ${images.length>1?'flash-visual-auto':''}">
    ${images.map((src,i)=>`<div class="flash-visual-slide ${i===0?'active':''}"><img src="${esc(src)}" alt="Flash Sale" loading="${i===0?'eager':'lazy'}" decoding="async" fetchpriority="${i===0?'high':'low'}"></div>`).join('')}
  </div>`;
}
let FLASH_VISUAL_TIMERS = [];
function initFlashVisuals(){
  FLASH_VISUAL_TIMERS.forEach(t=>clearInterval(t));
  FLASH_VISUAL_TIMERS = [];
  document.querySelectorAll('.flash-visual-auto').forEach(el=>{
    const slides = el.querySelectorAll('.flash-visual-slide');
    if(slides.length<2) return;
    let idx = 0;

      slides[idx].classList.remove('active');

function renderFlashSaleSection(sec){
  const cfg = sec.config||{};
  let sales;
  if(cfg.flashSaleId){
    const chosen = FLASHSALES.find(f=>f.id===cfg.flashSaleId && f.status==='active');

  const allActive = activeFlashSales();
  return `<section class="section container">
    <div class="section-head"><div><h2>${esc(sec.title||'Flash Sale')}</h2><p>${esc(sec.subtitle||'')}</p></div>

    <div class="flash-carousel" data-sec="${sec.id}">
      <div class="flash-track">${sales.map(flashSlideHtml).join('')}</div>
      ${sales.length>1?`<div class="flash-dots">${sales.map((f,i)=>`<button type="button" data-dot="${i}" class="${i===0?'active':''}" aria-label="Show flash sale ${i+1}"></button>`).join('')}</div>`:''}
    </div>
  </section>`;
}


function initFlashCarousels(){
  FLASH_CAROUSEL_TIMERS.forEach(t=>clearInterval(t));
  FLASH_CAROUSEL_TIMERS = [];
  document.querySelectorAll('.flash-carousel').forEach(wrap=>{
    const track = wrap.querySelector('.flash-track');
    const slides = wrap.querySelectorAll('.flash-slide');
    const dots = wrap.querySelectorAll('.flash-dots button');
    if(!track || slides.length<2) return;
    let idx = 0;
    const goTo = (i)=>{
      idx = i;
      track.style.transform = `translateX(-${idx*100}%)`;
      dots.forEach((d,di)=>d.classList.toggle('active', di===idx));
    };
    dots.forEach(d=>d.addEventListener('click', (e)=>{ e.preventDefault(); goTo(Number(d.getAttribute('data-dot'))); }));
    const timer = setInterval(()=>{ goTo((idx+1) % slides.length); }, 5000);
    FLASH_CAROUSEL_TIMERS.push(timer);
  });
}

function filteredProducts(filter){
  // Homepage collections should only show products that are currently in stock.
  // Out-of-stock products remain available in the full All Products catalog.
  let list = PRODUCTS.filter(p=>p.status==='published' && Math.max(0,Number(p.stock)||0)>0);
  if(filter==='featured') list = list.filter(p=>p.featured);
  else if(filter==='trending') list = list.filter(p=>p.trending);
  else if(filter==='newArrival') list = list.filter(p=>p.newArrival);
  else if(filter==='bestSeller') list = list.filter(p=>p.bestSeller);
  return list.sort((a,b)=>(a.order||0)-(b.order||0));
}

function safeRichHtml(html){
  let s=String(html||'');
  s=s.replace(/<\s*(script|iframe|object|embed|form|link|meta)[^>]*>[\s\S]*?<\s*\/\s*\1\s*>/gi,'');
  s=s.replace(/<\s*(script|iframe|object|embed|form|link|meta)[^>]*\/?\s*>/gi,'');
  s=s.replace(/\son[a-z]+\s*=\s*(['"]).*?\1/gi,'');
  s=s.replace(/\s(href|src)\s*=\s*(['"])\s*javascript:[\s\S]*?\2/gi,'');
  return s;
}
function bannerStyle(b){
  const d=Object.assign({height:260,radius:12,overlay:.25,padding:30,imageFit:'cover'},b.display||{});
  return `height:${Math.max(80,Number(d.height)||260)}px;min-height:${Math.max(80,Number(d.height)||260)}px;border-radius:${Math.max(0,Number(d.radius)||0)}px;background-size:${esc(d.imageFit||'cover')};--promo-overlay:${Math.max(0,Math.min(1,Number(d.overlay)||0))}`;
}
function renderBannerSection(sec){

  return `<section class="section container"><a class="promo-banner" href="${esc(b.buttonUrl||'#/')}" data-lazy-bg="${esc(mediaSrc(b.desktopImage||b.image))}" style="${bannerStyle(b)}">

function renderProductCard(p, options={}){

function shortProductKey(p){return String((p&&p.seo&&p.seo.slug)||p&&p.id||'').trim();}
function storefrontBaseUrl(){return window.location.origin+window.location.pathname;}
function makeShareUrl(kind,key){const base=storefrontBaseUrl();if(kind==='product')return base+'#/p/'+encodeURIComponent(String(key||''));if(kind==='flash')return base+'#/f/'+encodeURIComponent(String(key||''));return base+'#/';}
async function copyShareUrl(url){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(url);toast('Share link copied ✓');return true;}}catch(_){}try{const ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');ta.remove();toast('Share link copied ✓');return true;}catch(_){}toast('Copy failed. Please copy the link from the address bar.');return false;}
async function shareUrl(url,title,text){try{if(navigator.share){await navigator.share({title:title||SETTINGS?.siteName||'StoreX',text:text||'',url});return true;}}catch(e){if(e&&e.name==='AbortError')return false;}return copyShareUrl(url);}

function storexBaseSortCustomerProducts(list){
  const arr=[...list];
  const stockFirst=(a,b)=>(Math.max(0,Number(b.stock)||0)>0?1:0)-(Math.max(0,Number(a.stock)||0)>0?1:0);
  switch(CUSTOMER_PRODUCT_SORT){
    case 'price-low': return arr.sort((a,b)=>(Number(a.specialPrice??a.price)||0)-(Number(b.specialPrice??b.price)||0));
    case 'price-high': return arr.sort((a,b)=>(Number(b.specialPrice??b.price)||0)-(Number(a.specialPrice??a.price)||0));
    case 'newest': return arr.sort((a,b)=>Number(b.created_at?new Date(b.created_at).getTime():b.order||0)-Number(a.created_at?new Date(a.created_at).getTime():a.order||0));
    case 'discount': return arr.sort((a,b)=>{const da=Number(a.discount)||0,db=Number(b.discount)||0;return db-da;});
    case 'name': return arr.sort((a,b)=>String(a.title||'').localeCompare(String(b.title||'')));
    default: return arr.sort((a,b)=>stockFirst(a,b)||(a.order||0)-(b.order||0));
  }
}
function setCustomerProductSort(value){CUSTOMER_PRODUCT_SORT=String(value||'default');render();}

/* ================= COUNTDOWN ================= */
let COUNTDOWN_TIMER = null;
function startCountdowns(){
  if(COUNTDOWN_TIMER) clearInterval(COUNTDOWN_TIMER);
  const tick = ()=>{
    document.querySelectorAll('[data-countdown]').forEach(el=>{
      const end = el.getAttribute('data-countdown');
      if(!end) return;
      const diff = new Date(end).getTime() - Date.now();
      if(diff<=0){ el.innerHTML = '<div class="chip" style="min-width:auto;padding:8px 14px;">Sale ended</div>'; return; }
      const d = Math.floor(diff/86400000), h=Math.floor(diff/3600000)%24, m=Math.floor(diff/60000)%60, s=Math.floor(diff/1000)%60;
      const dEl=el.querySelector('.d'),hEl=el.querySelector('.h'),mEl=el.querySelector('.m'),sEl=el.querySelector('.s');
      if(dEl){dEl.textContent=String(d).padStart(2,'0');hEl.textContent=String(h).padStart(2,'0');mEl.textContent=String(m).padStart(2,'0');sEl.textContent=String(s).padStart(2,'0');}
    });
  };
  tick(); COUNTDOWN_TIMER = setInterval(tick,1000);
}

function wireStorefrontEvents(){
  // Event delegation keeps storefront controls working after every hash-route render.
  // Most controls use inline handlers, but delegation covers links/forms that are
  // dynamically replaced and makes local-file Chrome usage more reliable.
  const app=document.getElementById('app');
  if(!app || app.dataset.StoreXWired==='1') return;
  app.dataset.StoreXWired='1';
  app.addEventListener('click',e=>{
    const a=e.target.closest('a[href^="#/"]');
    if(a){
      const href=a.getAttribute('href');
      if(href){ e.preventDefault(); location.hash=href.slice(1)||'/'; }
    }
  });
  app.addEventListener('submit',e=>{
    const form=e.target.closest('.search-form');
    if(!form) return;
    e.preventDefault();
    const input=form.querySelector('input[name="q"]');
    const q=(input?.value||'').trim();
    if(q) location.hash='/search?q='+encodeURIComponent(q);
  });
}

let MEDIA_PICKER_CALLBACK=null;
let MEDIA_PICKER_MULTIPLE=false;
let MEDIA_PICKER_SELECTED=[];
function closeMediaPicker(){
  const el=document.getElementById('media-picker-overlay');
  if(el)el.remove();

  MEDIA_PICKER_MULTIPLE=false;

function openMediaPicker(callback, options={}){
  MEDIA_PICKER_CALLBACK=callback;
  MEDIA_PICKER_MULTIPLE=!!options.multiple;
  MEDIA_PICKER_SELECTED=[];
  const pickerId='media-device-input-'+uid();
  const el=document.createElement('div');
  el.id='media-picker-overlay';
  el.className='modal-overlay';
  el.style.zIndex='120';
  el.innerHTML=`<div class="modal-box">
    <h2>Select image from Media Library</h2>
    <p style="font-size:12.5px;color:var(--ink-soft);">${MEDIA_PICKER_MULTIPLE?'Select one or more images, then click Done.':'Choose an existing image or upload a new image. Your current form will stay open.'}</p>

      <label class="btn small media-upload-button">Upload from device
        <input id="${pickerId}" type="file" accept="image/*" ${MEDIA_PICKER_MULTIPLE?'multiple':''} onchange="handleMediaPickerFile(this)">

    <div class="modal-close-row">
      <button type="button" class="btn ghost" onclick="closeMediaPicker()">Cancel</button>
      ${MEDIA_PICKER_MULTIPLE?'<button type="button" class="btn" onclick="finishMediaPicker()">Done / Select</button>':''}
    </div>
  </div>`;
  document.body.appendChild(el);
}
async function handleMediaPickerFile(input){
  const files=Array.from(input?.files||[]);
  if(!files.length)return;
  const status=document.getElementById('media-picker-status');
  if(status)status.textContent='Uploading image'+(files.length>1?'s':'')+'…';
  input.disabled=true;
  try{
    const urls=[];
    for(const file of files){
      if(!file.type.startsWith('image/'))continue;
      const url=await uploadImageToSupabase(file);
      await rememberMediaUrl(url,file.name||'image');
      urls.push(url);
    }
    if(MEDIA_PICKER_MULTIPLE){
      const cb=MEDIA_PICKER_CALLBACK;
      if(typeof cb==='function' && urls.length)cb(urls);
      closeMediaPicker();
      toast((urls.length||0)+' image'+(urls.length===1?'':'s')+' selected successfully ✓');
    }else{
      const cb=MEDIA_PICKER_CALLBACK;
      closeMediaPicker();
      if(typeof cb==='function'&&urls[0])cb(urls[0]);
      toast('Image selected successfully ✓');
    }
  }catch(e){
    console.error('Media picker upload failed:',e);
    if(status)status.textContent='Upload failed. You can try again.';
    toast('Image upload failed: '+(e.message||'Unknown error'));
    input.disabled=false;
    input.value='';
  }
}
function selectMediaForField(id){
  const url=mediaSrc(id);
  if(!url)return;
  if(MEDIA_PICKER_MULTIPLE){
    const idx=MEDIA_PICKER_SELECTED.indexOf(id);
    if(idx>=0)MEDIA_PICKER_SELECTED.splice(idx,1); else MEDIA_PICKER_SELECTED.push(id);
    const btn=document.getElementById('media-pick-'+id);
    if(btn)btn.classList.toggle('sel',MEDIA_PICKER_SELECTED.includes(id));
    const status=document.getElementById('media-picker-status');
    if(status)status.textContent=MEDIA_PICKER_SELECTED.length+' image'+(MEDIA_PICKER_SELECTED.length===1?'':'s')+' selected';
    return;
  }
  const cb=MEDIA_PICKER_CALLBACK;
  closeMediaPicker();
  if(typeof cb==='function')cb(url);
}
function finishMediaPicker(){
  const urls=MEDIA_PICKER_SELECTED.map(id=>mediaSrc(id)).filter(Boolean);
  const cb=MEDIA_PICKER_CALLBACK;
  closeMediaPicker();
  if(typeof cb==='function')cb(urls);
}

function getProductImageDraft(pid,isNew){
  return isNew ? window.__draftProduct : PRODUCTS.find(x=>x.id===pid);
}
function persistProductImageEdit(isNew){
  if(!isNew) saveKey(KEYS.products,PRODUCTS,{silent:true});
}
function renderProductImageEditor(p,isNew){
  const images=Array.isArray(p?.images)?p.images:[];
  if(!images.length) return '<div style="grid-column:1/-1;color:var(--ink-soft);font-size:12px;padding:8px 0;">No images added yet.</div>';
  return images.map((im,index)=>`
    <div class="product-image-item ${p.mainImage===im?'is-main':''}">
      <img src="${esc(mediaSrc(im))}" alt="Product image ${index+1}">
      <span class="image-number">Image ${index+1}${p.mainImage===im?' · Main':''}</span>
      <div class="image-tools">
        <button type="button" onclick="setMainProductImage('${esc(p.id)}','${esc(im)}',${isNew})">Set Main</button>
        <button type="button" onclick="moveProductImage('${esc(p.id)}',${index},-1,${isNew})" ${index===0?'disabled':''}>↑</button>
        <button type="button" onclick="moveProductImage('${esc(p.id)}',${index},1,${isNew})" ${index===images.length-1?'disabled':''}>↓</button>
        <button type="button" class="danger" onclick="deleteProductImage('${esc(p.id)}',${index},${isNew})">Delete</button>
      </div>
    </div>`).join('');
}
function refreshProductImageEditor(pid,isNew){
  const p=getProductImageDraft(pid,isNew);
  const list=document.getElementById('product-img-list-'+pid);
  if(list&&p)list.innerHTML=renderProductImageEditor(p,isNew);
}
function addProductImage(pid, mediaId, isNew){
  const p=getProductImageDraft(pid,isNew);
  if(!p||!mediaId)return;
  p.images=Array.isArray(p.images)?p.images:[];
  if(!p.images.includes(mediaId))p.images.push(mediaId);
  if(!p.mainImage)p.mainImage=mediaId;
  persistProductImageEdit(isNew);
  refreshProductImageEditor(pid,isNew);
}
function setMainProductImage(pid, mediaId, isNew){
  const p=getProductImageDraft(pid,isNew);
  if(!p)return;
  p.images=Array.isArray(p.images)?p.images:[];
  if(p.images.includes(mediaId))p.mainImage=mediaId;
  persistProductImageEdit(isNew);
  refreshProductImageEditor(pid,isNew);
}
function moveProductImage(pid,index,direction,isNew){
  const p=getProductImageDraft(pid,isNew);
  if(!p||!Array.isArray(p.images))return;
  const next=index+direction;
  if(index<0||next<0||index>=p.images.length||next>=p.images.length)return;
  const [item]=p.images.splice(index,1);
  p.images.splice(next,0,item);
  persistProductImageEdit(isNew);
  refreshProductImageEditor(pid,isNew);
}
function deleteProductImage(pid,index,isNew){
  const p=getProductImageDraft(pid,isNew);
  if(!p||!Array.isArray(p.images)||index<0||index>=p.images.length)return;
  const removed=p.images[index];
  if(!confirm('Delete Image '+(index+1)+' from this product?'))return;
  p.images.splice(index,1);
  if(p.mainImage===removed)p.mainImage=p.images[0]||null;
  if(!p.images.length)p.mainImage=null;
  persistProductImageEdit(isNew);
  refreshProductImageEditor(pid,isNew);
}

function saveProductForm(pid, isNew){
  const form = document.getElementById('product-form');
  const fd = new FormData(form);
  const draft = isNew ? window.__draftProduct : PRODUCTS.find(x=>x.id===pid);
  const title = fd.get('title').trim();
  const originalPrice=Number(fd.get('originalPrice')||0), specialPrice=Number(fd.get('specialPrice')||originalPrice), stock=Math.max(0,Number(fd.get('stock')||0));
  if(originalPrice<0 || specialPrice<0 || specialPrice>originalPrice){ toast('Special price must be between 0 and original price.'); return; }
  const autoDiscount=originalPrice>0?Math.round((originalPrice-specialPrice)/originalPrice*100):0;
  draft.images=Array.isArray(draft.images)?draft.images.filter(Boolean):[];
  if(draft.mainImage && !draft.images.includes(draft.mainImage))draft.mainImage=draft.images[0]||null;
  if(!draft.mainImage && draft.images.length)draft.mainImage=draft.images[0];
  Object.assign(draft, {
    title, shortTitle: fd.get('shortTitle').trim(),
    shortDesc: fd.get('shortDesc').trim(), fullDesc: fd.get('fullDesc').trim(),
    category: fd.get('category'), tags: fd.get('tags').split(',').map(t=>t.trim()).filter(Boolean),
    price:specialPrice, oldPrice:originalPrice, originalPrice, specialPrice, stock, deliveryCharges:Math.max(0,Number(fd.get('deliveryCharges')||0)),
    discount:autoDiscount, badge:autoDiscount?'-'+autoDiscount+'%':fd.get('badge').trim(),
    promotion:{title:String(fd.get('promotionTitle')||'').trim(),freeDelivery:Number(fd.get('freeDeliveryQty')||0)>0,freeDeliveryQty:Number(fd.get('freeDeliveryQty')||0),percentOff:Math.max(0,Number(fd.get('percentOff')||0)),percentOffQty:Math.max(0,Number(fd.get('percentOffQty')||0)),buyQty:Math.max(0,Number(fd.get('buyQty')||0)),freeQty:Math.max(0,Number(fd.get('freeQty')||0))},
    status: fd.get('status'), order: Number(fd.get('order'))||0,
    featured: fd.get('featured')==='on', trending: fd.get('trending')==='on', newArrival: fd.get('newArrival')==='on', bestSeller: fd.get('bestSeller')==='on',
    seo: { slug: slugify(fd.get('seoSlug').trim() || title), title: fd.get('seoTitle').trim(), keywords: fd.get('seoKeywords').trim(), description: fd.get('seoDescription').trim() }
  });
  if(isNew){ PRODUCTS.push(draft); window.__draftProduct=null; }
  saveKey(KEYS.products, PRODUCTS);
  closeModal(); toast('Product saved in this session');
}

function adminOrderActions(o){
  const s=String(o.status||'pending').toLowerCase();
  const btns=[];
  if(s==='pending') btns.push(`<button class="btn small" onclick="updateOrderStatus('${o.id}','confirmed')">Confirm</button>`);
  if(s==='confirmed') btns.push(`<button class="btn small" onclick="updateOrderStatus('${o.id}','ready_to_ship')">Ready to Ship</button>`);
  if(s==='ready_to_ship') btns.push(`<button class="btn small" onclick="updateOrderStatus('${o.id}','shipped')">Shipped</button>`);
  if(s==='shipped') btns.push(`<button class="btn small" onclick="updateOrderStatus('${o.id}','delivered')">Delivered</button>`);
  if(s==='pending'||s==='confirmed') btns.push(`<button class="btn small danger" onclick="updateOrderStatus('${o.id}','cancelled')">Cancel</button>`);
  if(s==='return_requested'||s==='delivered') btns.push(`<button class="btn small" onclick="updateOrderStatus('${o.id}','returned')">Mark Returned</button>`);
  return btns.join(' ');
}

async function loadHtml2Canvas(){
  if(window.html2canvas) return window.html2canvas;

    const existing=document.querySelector('script[data-html2canvas]');
    if(existing){existing.addEventListener('load',resolve,{once:true});existing.addEventListener('error',reject,{once:true});return;}
    const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';sc.async=true;sc.dataset.html2canvas='1';sc.onload=resolve;sc.onerror=()=>reject(new Error('Image export library could not be loaded.'));document.head.appendChild(sc);
  });
  return window.html2canvas;
}

async function saveCouponForm(id,isNew,form){
  if(!supabaseClient||!SUPABASE_READY){toast('Supabase is not available.');return;}
  const fd=new FormData(form);
  const scope=fd.get('applicable_scope')||'all';
  let ids=[];
  if(scope==='products') ids=[...form.querySelector('[name=applicable_products]').selectedOptions].map(o=>o.value);
  else if(scope==='categories') ids=[...form.querySelector('[name=applicable_categories]').selectedOptions].map(o=>o.value);
  const payload={
    code:String(fd.get('code')||'').trim().toUpperCase(),
    description:String(fd.get('description')||'').trim(),
    discount_type:fd.get('discount_type'),
    discount_value:Number(fd.get('discount_value'))||0,
    min_order:Number(fd.get('min_order'))||0,
    max_discount:fd.get('max_discount')?Number(fd.get('max_discount')):null,
    starts_at:fd.get('starts_at')?new Date(fd.get('starts_at')).toISOString():null,
    ends_at:fd.get('ends_at')?new Date(fd.get('ends_at')+'T23:59:59').toISOString():null,
    usage_limit:fd.get('usage_limit')?Number(fd.get('usage_limit')):null,
    per_customer_limit:fd.get('per_customer_limit')?Number(fd.get('per_customer_limit')):null,
    active:fd.get('active')==='on',
    applicable_scope:scope,
    applicable_ids:ids,
    free_shipping:fd.get('free_shipping')==='on',
    first_order_only:fd.get('first_order_only')==='on'
  };
  if(!payload.code){toast('Please enter a coupon code.');return;}
  try{
    if(isNew){
      const {error}=await supabaseClient.from('storex_coupons').insert(payload);
      if(error) throw error;
    }else{
      const {error}=await supabaseClient.from('storex_coupons').update(payload).eq('id',id);
      if(error) throw error;
    }
    closeModal(); toast('Coupon saved ✓');
    await loadAdminCoupons(); await loadCoupons(); render();
  }catch(e){ toast('Coupon save failed: '+(e.message||'Unknown error')); }
}
async function toggleCouponActive(id,active){
  if(!supabaseClient||!SUPABASE_READY)return;
  try{ const {error}=await supabaseClient.from('storex_coupons').update({active}).eq('id',id); if(error)throw error;
    await loadAdminCoupons(); await loadCoupons(); render(); toast(active?'Coupon enabled':'Coupon disabled');
  }catch(e){ toast('Update failed: '+(e.message||'Unknown error')); }
}
async function deleteCoupon(id){
  if(!confirm('Delete this coupon? This cannot be undone.')) return;
  if(!supabaseClient||!SUPABASE_READY)return;
  try{ const {error}=await supabaseClient.from('storex_coupons').delete().eq('id',id); if(error)throw error;
    await loadAdminCoupons(); await loadCoupons(); render(); toast('Coupon deleted');
  }catch(e){ toast('Delete failed: '+(e.message||'Unknown error')); }
}

  const form = document.getElementById('category-form'); const fd = new FormData(form);

    icon: fd.get('icon').trim(), order: Number(fd.get('order'))||0, status: fd.get('status'), homeFeatured:fd.get('homeFeatured')==='on',
    seo: { title: fd.get('seoTitle').trim(), keywords: fd.get('seoKeywords').trim(), description: fd.get('seoDescription').trim() }
  });
  if(isNew){ CATEGORIES.push(draft); window.__draftCategory=null; }

}

function renderFlashProductsList(f){
  if(!f.products || !f.products.length) return '<p style="font-size:13px;color:var(--ink-soft);">No products added yet.</p>';
  return f.products.map((entry,i)=>{
    const label = entry.type==='existing' ? (PRODUCTS.find(p=>p.id===entry.productId)||{}).title || 'Unknown product' : entry.title+' (custom)';
    return `<div class="section-list-item" style="cursor:default;"><span class="meta"><b>${esc(label)}</b></span><button type="button" class="btn small danger" onclick="removeFlashProduct('${f.id}',${i})">Remove</button></div>`;
  }).join('');
}

function getFlashDraft(id, isNew){ return isNew ? window.__draftFlash : FLASHSALES.find(x=>x.id===id); }

function addExistingToFlash(id, isNew){
  const f = getFlashDraft(id,isNew); const sel = document.getElementById('flash-existing-select');
  if(!sel.value) return;
  f.products = f.products||[]; f.products.push({type:'existing', productId: sel.value});
  document.getElementById('flash-products-list').innerHTML = renderFlashProductsList(f);
}

function addCustomFlashProduct(id, isNew){
  const f = getFlashDraft(id,isNew);
  const title = prompt('Custom product title:'); if(!title) return;
  const price = Number(prompt('Price (optional):','')||0);
  f.products = f.products||[]; f.products.push({type:'custom', title, price, image:null, desc:'', badge:''});
  document.getElementById('flash-products-list').innerHTML = renderFlashProductsList(f);
}

function removeFlashProduct(id, idx){
  const isNewCheck = !FLASHSALES.find(x=>x.id===id);
  const f = getFlashDraft(id, isNewCheck);
  f.products.splice(idx,1);
  document.getElementById('flash-products-list').innerHTML = renderFlashProductsList(f);
}

function saveFlashForm(id, isNew){
  const form = document.getElementById('flash-form'); const fd = new FormData(form);
  const draft = getFlashDraft(id,isNew);
  if(!draft.banner){ toast('Please add Flash Sale Image 1 (it is required)'); return; }
  const title = fd.get('title').trim();
  Object.assign(draft,{
    title, slug: slugify(fd.get('slug').trim()||title), subtitle: fd.get('subtitle').trim(),
    start: fd.get('start'), end: fd.get('end'), status: fd.get('status'), description: fd.get('description').trim(),
    display:{height:Number(fd.get('displayHeight'))||360,infoBg:fd.get('infoBg')||'',textColor:fd.get('textColor')||'#FFFFFF',accentColor:fd.get('accentColor')||'#F57224',imageFit:fd.get('imageFit')||'cover'},
    seo: { title: fd.get('seoTitle').trim(), keywords: fd.get('seoKeywords').trim(), description: fd.get('seoDescription').trim() }
  });
  if(isNew){ FLASHSALES.push(draft); window.__draftFlash=null; }
